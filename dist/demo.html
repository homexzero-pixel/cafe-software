<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaapi &amp; Marble, AR menu and café manager</title>
<meta name="theme-color" content="#6F4A2F">
<meta name="description" content="Café software: a customer portal with a 3D AR menu on your table, plus billing, kitchen tickets, recipe-based stock and GST reports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6F4A2F;--brand-2:#82573A;--deep:#3E2A1E;--deeper:#26180F;--brand-t:#F5EEE7;--brand-t2:#E8DACB;
  --caramel:#D59A55;--caramel-2:#BF8240;--caramel-ink:#7A4E1E;--caramel-t:#FBF2E6;
  --paper:#FBF9F6;--surface:#FFFFFF;--line:#E9E1D8;--line-2:#F1EBE4;
  --ink:#2B1F17;--ink-2:#62513F;--ink-3:#8E7D6F;--ink-inv:#FCF8F3;
  --leaf:#1F8A4C;--leaf-t:#E3F3EA;--rust:#8C3B17;--danger:#C2341D;--danger-t:#FBE9E6;--warn:#A86400;--warn-t:#FFF1D6;
  --r-xl:22px;--r-lg:16px;--r-md:12px;--r-sm:8px;
  --f-ui:'Anek Latin',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Yatra One','Anek Latin',Georgia,serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.num,.money{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;background:var(--brand);color:#fff;font-weight:600;font-size:15px;letter-spacing:.01em;transition:background .15s,transform .1s,border-color .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--brand-2)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.saffron{background:var(--caramel);color:var(--deeper)}
.btn.saffron:hover{background:#E0AC6C}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--brand-t2)}
.btn.ghost:hover{background:var(--brand-t)}
.btn.quiet{background:var(--brand-t);color:var(--brand)}
.btn.quiet:hover{background:var(--brand-t2)}
.btn.danger{background:var(--danger)}
.btn.danger.ghost{background:transparent;color:var(--danger);border-color:#F0C9C2}
.btn.white{background:#fff;color:var(--brand)}
.btn.sm{min-height:34px;padding:0 13px;font-size:14px}
.btn.xs{min-height:28px;padding:0 10px;font-size:13px;gap:5px}
.btn.block{width:100%}
.btn.lg{min-height:52px;font-size:16px;padding:0 22px}
.btn.icon{width:44px;padding:0}
.btn.icon.sm{width:34px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;color:var(--ink-2);font-weight:500}
.field small{color:var(--ink-3);font-size:12px}
.in,select.in,textarea.in{width:100%;min-height:42px;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;transition:border-color .15s}
.in:focus{outline:none;border-color:var(--brand)}
textarea.in{min-height:72px;resize:vertical}
.in.err{border-color:var(--danger)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.right{text-align:right}
.seg{display:inline-flex;background:var(--brand-t);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--brand)}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 2px rgba(62,42,30,.18)}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex:none;vertical-align:middle}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:44px;height:26px;border-radius:999px;background:#D6CABE;transition:background .15s;cursor:pointer}
.switch input:checked{background:var(--leaf)}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked::after{transform:translateX(18px)}

/* ---------- marks & chips ---------- */
.vmark{display:inline-grid;place-items:center;width:15px;height:15px;border:1.6px solid var(--leaf);border-radius:3px;flex:none;vertical-align:-2px}
.vmark::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--leaf)}
.vmark.nv{border-color:var(--rust)}
.vmark.nv::after{border-radius:0;width:0;height:0;background:none;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-bottom:7.5px solid var(--rust)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--leaf-t);color:#13633A}
.chip.warn{background:var(--warn-t);color:#7A4A00}
.chip.bad{background:var(--danger-t);color:#9E2A17}
.chip.info{background:var(--brand-t);color:var(--brand)}
.chip.new{background:var(--caramel-t);color:#7A4F00}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--caramel);color:var(--deeper);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- toast / modal ---------- */
#toasts{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--deeper);color:#fff;border-radius:14px;padding:11px 15px;font-weight:500;box-shadow:0 10px 30px rgba(38,24,15,.25);display:flex;gap:10px;align-items:center;animation:tin .25s var(--ease);pointer-events:auto}
.toast.ok .ic{color:#7BE0A6}.toast.bad{background:#7A1E10}.toast.warn .ic{color:var(--caramel)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.scrim{position:fixed;inset:0;background:rgba(38,24,15,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--surface);width:100%;max-width:560px;max-height:92vh;border-radius:var(--r-xl) var(--r-xl) 0 0;display:flex;flex-direction:column;animation:up .28s var(--ease);padding-bottom:var(--safe-b)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.dialog.wide{max-width:880px}
.dialog-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.dialog-h h2{margin:0;font-size:19px;font-weight:650;flex:1}
.dialog-b{padding:4px 18px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
.dialog-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line-2)}
@media (min-width:720px){.scrim{align-items:center}.dialog{border-radius:var(--r-xl);max-height:88vh}}
.close-x{border:0;background:var(--line-2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}

/* ---------- welcome ---------- */
.welcome{min-height:100%;display:grid;place-items:center;padding:calc(28px + var(--safe-t)) 18px calc(28px + var(--safe-b));background:var(--deep);color:#fff;position:relative;overflow:hidden}
.welcome-in{max-width:880px;width:100%;position:relative}
.plate{display:inline-flex;align-items:center;gap:10px;background:var(--brand);color:#fff;border-radius:12px;padding:7px 16px 6px;box-shadow:inset 0 0 0 2.5px var(--brand),inset 0 0 0 4px rgba(255,255,255,.92);font-family:var(--f-disp);font-size:22px;line-height:1.1;letter-spacing:.01em}
.plate.lg{font-size:30px;padding:10px 22px 8px;border-radius:14px}
.welcome h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.08;margin:26px 0 10px;max-width:16ch}
.welcome p.lead{color:#E6D6C6;font-size:17px;max-width:52ch;margin:0 0 26px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{background:#fff;color:var(--ink);text-decoration:none;border-radius:var(--r-xl);padding:20px;border:0;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:190px;transition:transform .15s var(--ease)}
.door:hover{transform:translateY(-2px)}
.door h2{margin:0;font-size:21px;font-weight:650}
.door p{margin:0;color:var(--ink-2)}
.door .go{margin-top:auto;display:flex;align-items:center;gap:8px;color:var(--brand);font-weight:650}
.door.c{background:var(--caramel);color:var(--deeper)}
.door.c p{color:#4D3A10}.door.c .go{color:var(--deeper)}
.welcome .tables{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:#E6D6C6;font-size:14px}
.welcome .tables a{color:#fff;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;text-decoration:none;font-weight:600}
.welcome .tables a:hover{background:rgba(255,255,255,.2)}
.mode-note{margin-top:22px;font-size:13.5px;color:#D2BFAC;display:flex;gap:8px;align-items:flex-start;max-width:70ch}
@media (max-width:640px){.doors{grid-template-columns:1fr}.door{min-height:0}}

/* ---------- customer portal ---------- */
.cust{max-width:560px;margin:0 auto;min-height:100%;background:var(--paper);position:relative;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px)}
@media (min-width:600px){body.c-mode{background:#EAE2D8}.cust{box-shadow:0 0 0 1px var(--line)}}
.c-head{background:var(--brand);color:#fff;padding:calc(12px + var(--safe-t)) 16px 0;position:relative}
.c-top{display:flex;align-items:center;gap:10px}
.c-top .plate{font-size:19px;padding:6px 13px 5px;background:var(--deep);box-shadow:inset 0 0 0 2px var(--deep),inset 0 0 0 3.5px rgba(255,255,255,.9)}
.tbl-chip{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--caramel);color:var(--deeper);border:0;border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:6px;padding:8px 0 0;min-height:226px}
.hero-copy{padding:10px 0 22px}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:29px;line-height:1.08;margin:0 0 8px}
.hero p{margin:0 0 14px;color:#EDE0D2;font-size:14.5px}
.hero-stage{position:relative;height:226px;margin-right:-16px}
.stage{position:absolute;inset:0;touch-action:none}
.stage canvas{width:100%;height:100%;display:block}
.hero-name{position:absolute;right:16px;bottom:10px;font-size:12.5px;color:#E6D6C6;font-weight:600}
.c-tools{position:sticky;top:0;z-index:20;background:rgba(251,249,246,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:12px 16px 8px;border-bottom:1px solid var(--line-2)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:44px}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:15px}
.vtoggle{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--leaf-t);color:#13633A;border-radius:999px;height:32px;padding:0 11px;font-weight:650;font-size:13px}
.vtoggle[aria-pressed=false]{background:var(--line-2);color:var(--ink-2)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.cats::-webkit-scrollbar{display:none}
.cat{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink-2)}
.cat[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:22px 16px 8px}
.sec-h h2{margin:0;font-size:19px;font-weight:650}
.sec-h span{color:var(--ink-3);font-size:13px}
.list{background:#fff;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.dish{display:grid;grid-template-columns:84px 1fr auto;gap:12px;padding:12px 16px;align-items:center;border-bottom:1px solid var(--line-2);position:relative}
.dish:last-child{border-bottom:0}
.dish .th{width:84px;height:84px;border-radius:14px;background:radial-gradient(circle at 50% 60%,#fff 0,#F3EDE6 70%);display:grid;place-items:center;overflow:hidden;border:0;padding:0}
.dish .th img{width:112%;height:112%;object-fit:contain}
.dish .th .ph{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#EFE7DE,#FAF6F1)}
.dish-n{display:flex;align-items:center;gap:7px;font-weight:650;font-size:16px;line-height:1.2}
.dish-d{color:var(--ink-2);font-size:13.5px;margin:3px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-m{display:flex;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px;align-items:center}
.dish-m .tag{color:var(--caramel-ink);font-weight:600}
.dish-p{font-weight:700;font-size:15.5px;text-align:right;margin-bottom:8px}
.dish-r{display:flex;flex-direction:column;align-items:flex-end}
.dish.off .th,.dish.off .dish-n,.dish.off .dish-d{opacity:.55}
.dish .open{position:absolute;inset:0;border:0;background:transparent;z-index:0}
.dish>*:not(.open){position:relative;z-index:1;pointer-events:none}
.dish .th{position:relative;z-index:1}
.dish button:not(.open),.dish .stepper{pointer-events:auto}
.addbtn{min-width:84px;height:36px;border-radius:999px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.addbtn:hover{background:var(--brand-t)}
.stepper{display:inline-flex;align-items:center;height:36px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;min-width:96px;justify-content:space-between}
.stepper button{border:0;background:transparent;color:inherit;width:34px;height:36px;display:grid;place-items:center;border-radius:999px}
.stepper button:hover{background:rgba(255,255,255,.14)}
.stepper span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.stepper.lg{height:46px;min-width:128px}.stepper.lg button{width:44px;height:46px}
.offlbl{font-size:12.5px;font-weight:650;color:var(--danger);text-align:right;max-width:96px;line-height:1.2}
.offlbl.time{color:var(--warn)}
.leftlbl{font-size:12px;color:var(--warn);font-weight:600;margin-top:4px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 10px);width:min(528px,calc(100% - 24px));z-index:30;display:flex;align-items:center;gap:12px;background:var(--deep);color:#fff;border:0;border-radius:16px;padding:10px 12px 10px 16px;box-shadow:0 12px 30px rgba(38,24,15,.3);animation:up .25s var(--ease)}
.cartbar b{font-size:16px}
.cartbar .grow{text-align:left}
.cartbar small{color:#D9C6B3;display:block;font-size:12.5px}
.cartbar .btn{min-height:40px}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:40}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);text-decoration:none;font-size:12px;font-weight:600;position:relative}
.bnav a[aria-current=page]{color:var(--brand)}
.bnav a .badge{position:absolute;top:6px;left:calc(50% + 6px)}
.bnav a.cam{color:var(--deeper)}
.bnav a.cam .ring{width:46px;height:46px;border-radius:50%;background:var(--caramel);display:grid;place-items:center;margin-top:-22px;box-shadow:0 0 0 5px #fff,0 6px 16px rgba(38,24,15,.18)}
.page-h{padding:calc(16px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px}
.page-h h1{margin:0;font-size:24px;font-weight:650;flex:1}
.panel{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-lg)}
.c-pad{padding:0 16px}
.cart-line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.cart-line:last-child{border-bottom:0}
.cart-line img{width:56px;height:56px;object-fit:contain;border-radius:12px;background:#F6F1EB}
.cart-line .nm{font-weight:650}
.cart-line .note{font-size:13px;color:var(--ink-3);margin-top:2px}
.cart-line .note button{border:0;background:none;color:var(--brand);padding:0;font-size:13px;font-weight:600}
.sumtbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sumtbl td{padding:5px 0}
.sumtbl td:last-child{text-align:right}
.sumtbl tr.total td{font-weight:750;font-size:18px;padding-top:10px;border-top:1px dashed var(--line)}
.sumtbl tr.sub td{color:var(--ink-2);font-size:14px}
.paymethods{display:grid;gap:8px}
.pm{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;text-align:left;width:100%}
.pm .ico{width:40px;height:40px;border-radius:12px;background:var(--brand-t);color:var(--brand);display:grid;place-items:center;flex:none}
.pm b{display:block;font-size:15.5px}
.pm small{color:var(--ink-3);font-size:13px}
.pm[aria-checked=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;background:#FDFAF6}
.pm .radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.pm[aria-checked=true] .radio{border:6px solid var(--brand)}
.empty{padding:44px 24px;text-align:center;color:var(--ink-2)}
.empty h2{color:var(--ink);font-size:20px;margin:12px 0 6px}
.empty .ic{width:44px;height:44px;color:var(--brand);stroke-width:1.4}
.note-line{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:10px 2px}
.note-line .ic{color:var(--brand);margin-top:1px}
.bill-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px 16px;border-bottom:1px solid var(--line-2);background:#fff;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.bill-row:hover{background:#FDFBF8}
.bill-row .oid{font-weight:750;font-size:16.5px;font-variant-numeric:tabular-nums}
.bill-row .meta{color:var(--ink-3);font-size:13px}
.bill-row .tot{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bill-row .chips{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tracker{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 4px}
.tracker div{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.tracker div::before{content:'';height:5px;border-radius:999px;background:var(--line)}
.tracker div.done{color:var(--brand)}
.tracker div.done::before{background:var(--brand)}
.tracker div.now::before{background:linear-gradient(90deg,var(--brand) 0 50%,var(--brand-t2) 50%);background-size:200% 100%;animation:prog 1.6s linear infinite}
@keyframes prog{from{background-position:100% 0}to{background-position:0 0}}
.bigid{font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--brand);letter-spacing:.01em}
.confirm-hero{background:var(--brand);color:#fff;border-radius:var(--r-xl);padding:20px;margin:0 16px}
.confirm-hero .bigid{color:#fff}
.confirm-hero p{color:#EDE0D2;margin:6px 0 0}
.dsheet-stage{position:relative;height:300px;margin:0 -18px;background:radial-gradient(ellipse at 50% 70%,#FFFFFF 0,#EFE7DE 72%)}
.dsheet-stage .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12.5px;color:var(--ink-3)}
.kv{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
.kv span{display:inline-flex;align-items:center;gap:5px}
.upi-box{display:grid;justify-items:center;gap:8px;padding:6px 0}
.upi-box .qr{width:220px;height:220px;padding:10px;background:#fff;border-radius:16px;border:1px solid var(--line)}
.upi-box .qr svg{width:100%;height:100%;display:block}
.cardform{display:grid;gap:12px}
.cardnum{letter-spacing:.06em;font-variant-numeric:tabular-nums}
.testnote{background:var(--caramel-t);color:#5C3D00;border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px}
.counter-show{display:grid;justify-items:center;gap:10px;text-align:center;padding:10px 0}
.counter-show .qr{width:200px}

/* ---------- AR view ---------- */
.ar{position:fixed;inset:0;background:#1C130D;color:#fff;z-index:60;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.ar video,.ar .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar .virtual-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 90%,#5A4232 0,#2B1D14 55%,#1C130D 100%)}
.ar .stage{position:absolute;inset:0}
.ar-top{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--safe-t)) 12px 0;display:flex;gap:8px;align-items:center;z-index:5}
.glass{background:rgba(38,26,18,.74);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.12)}
.ar-btn{height:42px;min-width:42px;border-radius:999px;border:1px solid rgba(255,255,255,.14);display:inline-flex;align-items:center;justify-content:center;gap:7px;color:#fff;padding:0 13px;font-weight:600;font-size:14px;background:rgba(38,26,18,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ar-btn .badge{margin-left:2px}
.ar-cats{position:absolute;top:calc(60px + var(--safe-t));left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:0 12px;scrollbar-width:none;z-index:5}
.ar-cats::-webkit-scrollbar{display:none}
.ar-cats button{border:1px solid rgba(255,255,255,.18);background:rgba(38,26,18,.5);color:#F2E9DF;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;white-space:nowrap;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ar-cats button[aria-pressed=true]{background:#fff;color:var(--deeper);border-color:#fff}
.ar-card{position:absolute;left:12px;right:12px;bottom:calc(12px + var(--safe-b));border-radius:22px;padding:14px 14px 14px 16px;z-index:5;max-width:520px;margin:0 auto}
.ar-card .nm{font-family:var(--f-disp);font-size:25px;line-height:1.1;display:flex;align-items:center;gap:9px}
.ar-card .nm .vmark{background:#fff;border-radius:3px}
.ar-card p{margin:5px 0 10px;color:#E6D6C6;font-size:14px;line-height:1.35}
.ar-card .bottom{display:flex;align-items:center;gap:10px}
.ar-card .price{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.ar-card .count{color:#C9B39D;font-size:13px;font-variant-numeric:tabular-nums}
.ar-card .btn.saffron{margin-left:auto}
.ar-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ar-nav.l{left:10px}.ar-nav.r{right:10px}
.ar-hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;border-radius:18px;padding:14px 16px;max-width:300px;text-align:center;font-size:14px;line-height:1.4;pointer-events:none;transition:opacity .4s}
.ar-hint b{display:block;font-size:16px;margin-bottom:4px}
.ar-start{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 16px calc(20px + var(--safe-b));background:linear-gradient(180deg,rgba(28,19,13,.2),rgba(28,19,13,.92) 52%)}
.ar-start h2{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.1;margin:0 0 6px}
.ar-start p{color:#E6D6C6;margin:0 0 16px}
.ar-start .opts{display:grid;gap:10px}
.ar-opt{display:flex;gap:12px;align-items:center;text-align:left;border-radius:16px;padding:12px 14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff}
.ar-opt.primary{background:var(--caramel);color:var(--deeper);border-color:var(--caramel)}
.ar-opt .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);flex:none}
.ar-opt.primary .ico{background:rgba(38,24,15,.12)}
.ar-opt b{display:block;font-size:15.5px}
.ar-opt small{opacity:.8;font-size:13px}
.ar-msg{background:rgba(194,52,29,.2);border:1px solid rgba(255,140,120,.35);color:#FFD9D2;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.ar-tilt{position:absolute;right:6px;top:calc(120px + var(--safe-t));z-index:4;height:180px;width:36px;display:flex;align-items:center;justify-content:center;border-radius:999px}
.ar-tilt input{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:24px;height:150px;accent-color:var(--caramel)}
.ar .reticle-note{position:absolute;left:50%;top:calc(110px + var(--safe-t));transform:translateX(-50%);z-index:5;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.ar-placed{animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.9);opacity:.4}}

/* ---------- staff software ---------- */
.staff{display:grid;grid-template-columns:232px 1fr;min-height:100%;font-size:14.5px}
.side{background:var(--deep);color:#EDE2D6;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;gap:4px}
.side .plate{font-size:18px;margin:2px 6px 16px;align-self:flex-start;box-shadow:inset 0 0 0 2px var(--brand),inset 0 0 0 3.5px rgba(255,255,255,.85)}
.side a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#E2D2C2;text-decoration:none;font-weight:550;position:relative}
.side a:hover{background:rgba(255,255,255,.07);color:#fff}
.side a[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
.side a[aria-current=page]::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--caramel)}
.side a .badge{margin-left:auto}
.side .foot{margin-top:auto;display:grid;gap:8px;padding:8px 4px 0}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#CDB9A5;padding:6px 8px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#5BD08E;flex:none}
.sync.local .dot{background:var(--caramel)}
.sync.err .dot{background:#FF7A66}
.side .btn{justify-content:flex-start}
.side .btn.quiet{background:rgba(255,255,255,.08);color:#F3EBE2}
.main{min-width:0;padding:22px 26px 40px}
.s-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.s-head h1{margin:0;font-size:25px;font-weight:650;letter-spacing:-.005em}
.s-head .sub{color:var(--ink-3);font-size:14px;width:100%;margin-top:-6px}
.s-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.mtop{display:none}
@media (max-width:860px){
  .staff{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:262px;z-index:90;transform:translateX(-100%);transition:transform .25s var(--ease);height:100%}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(38,24,15,.4)}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;background:var(--deep);color:#fff;padding:calc(10px + var(--safe-t)) 12px 10px}
  .mtop .plate{font-size:16px;padding:5px 11px 4px}
  .main{padding:16px 14px 40px}
}
.box{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:16px 18px}
.box h2{margin:0 0 12px;font-size:16px;font-weight:650;display:flex;align-items:center;gap:8px}
.box h2 .faint{font-weight:500;font-size:13px;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);margin-bottom:14px}
.kpi{padding:16px 18px;border-left:1px solid var(--line-2);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{color:var(--ink-2);font-size:13px;font-weight:550}
.kpi .v{font-size:28px;font-weight:650;font-stretch:88%;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.kpi .d{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.kpi .d.up{color:var(--leaf)}.kpi .d.down{color:var(--danger)}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line-2)}}
.dash{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.dash .col{display:grid;gap:14px;align-content:start}
@media (max-width:1100px){.dash{grid-template-columns:1fr}}
.attn{display:grid;gap:2px}
.attn a,.attn button{display:flex;gap:10px;align-items:center;padding:9px 6px;border-radius:10px;text-decoration:none;color:inherit;border:0;background:transparent;text-align:left;width:100%}
.attn a:hover,.attn button:hover{background:var(--paper)}
.attn .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.attn .ico.bad{background:var(--danger-t);color:var(--danger)}.attn .ico.warn{background:var(--warn-t);color:var(--warn)}.attn .ico.info{background:var(--brand-t);color:var(--brand)}
.attn .t{font-weight:600}.attn .s{font-size:12.5px;color:var(--ink-3)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:fixed;pointer-events:none;background:var(--deeper);color:#fff;border-radius:10px;padding:7px 10px;font-size:13px;z-index:120;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:0 8px 20px rgba(38,24,15,.25)}
.chart .tip b{font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.hbar .track{height:12px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.hbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:#8B5A3C;min-width:2px}
.hbar .val{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:64px;text-align:right}
.split{display:flex;height:14px;gap:2px;border-radius:4px;overflow:hidden;margin:4px 0 12px}
.split div{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBF8F4;position:sticky;top:0}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#FBF7F2}
.tbl .num,.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:auto}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .search{height:40px;min-width:220px;flex:1;max-width:360px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
/* KOT board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1000px){.board{grid-template-columns:1fr}}
.lane{background:#F0E9E1;border-radius:var(--r-lg);padding:10px;min-height:120px}
.lane h2{margin:2px 4px 10px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.lane h2 .count{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
.lane .none{color:var(--ink-3);font-size:13.5px;padding:18px 6px;text-align:center}
.kot{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line-2);position:relative}
.kot.fresh{box-shadow:0 0 0 2px var(--caramel)}
.kot .hd{display:flex;align-items:baseline;gap:8px}
.kot .id{font-weight:750;font-size:17px;font-variant-numeric:tabular-nums}
.kot .where{font-weight:650;color:var(--brand)}
.kot .age{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink-2);font-size:13.5px}
.kot .age.late{color:var(--danger)}
.kot ul{list-style:none;margin:8px 0 10px;padding:8px 0 0;border-top:1px dashed var(--line)}
.kot li{display:flex;gap:8px;padding:3px 0;font-size:14.5px;align-items:baseline}
.kot li b{min-width:22px;font-variant-numeric:tabular-nums}
.kot li .n{font-size:12.5px;color:var(--warn);display:block}
.kot .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kot .ft .btn{margin-left:auto}
/* POS */
.pos{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
@media (max-width:1100px){.pos{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:8px 8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;transition:border-color .12s}
.tile:hover{border-color:var(--brand-t2)}
.tile img{width:100%;aspect-ratio:1;object-fit:contain;margin-bottom:2px}
.tile .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:flex;gap:6px;align-items:flex-start}
.tile .pr{font-weight:700;font-variant-numeric:tabular-nums}
.tile .q{position:absolute;top:8px;right:8px}
.tile.off{opacity:.5}
.tile .why{font-size:12px;color:var(--danger);font-weight:600}
.ticket{position:sticky;top:16px;display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.ticket .lines{overflow:auto;min-height:60px;margin:0 -18px;padding:0 18px}
.tline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.tline .nm{font-weight:600;font-size:14px}
.tline .sm{font-size:12.5px;color:var(--ink-3)}
.tline .amt{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px;text-align:right}
.mini-step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;height:30px}
.mini-step button{border:0;background:transparent;width:28px;height:28px;display:grid;place-items:center;color:var(--brand)}
.mini-step span{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.paybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paybtns .btn{border-radius:12px;flex-direction:column;gap:2px;min-height:58px;font-size:13.5px}
/* receipt (thermal) */
.receipt{font-family:var(--f-mono);font-size:12.5px;line-height:1.45;background:#fff;color:#111;width:100%;max-width:330px;margin:0 auto;padding:16px 14px;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(25,33,58,.08)}
.receipt .c{text-align:center}
.receipt h3{font-family:var(--f-disp);font-weight:400;font-size:21px;margin:0}
.receipt .hr{border-top:1px dashed #999;margin:8px 0}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:1px 0;vertical-align:top}
.receipt td.r{text-align:right;white-space:nowrap}
.receipt .tot td{font-weight:700;font-size:14px}
.receipt .small{font-size:11px;color:#444}
.stockbar{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden;width:90px;margin-top:4px}
.stockbar i{display:block;height:100%;background:var(--leaf)}
.stockbar.low i{background:var(--caramel-2)}.stockbar.out i{background:var(--danger)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.qrcard{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-lg);padding:14px;text-align:center;display:grid;gap:6px;justify-items:center}
.qrcard .qr{width:140px;height:140px}
.qrcard .qr svg{width:100%;height:100%}
.qrcard b{font-family:var(--f-disp);font-weight:400;font-size:20px;color:var(--brand)}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.setup .box{display:grid;gap:12px}
.lock{min-height:100vh;display:grid;place-items:center;background:var(--deep);color:#fff;padding:calc(20px + var(--safe-t)) 20px 20px}
.lock-in{width:min(340px,100%);text-align:center;display:grid;gap:14px;justify-items:center}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:6px 0}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid #C9B39D}
.pin-dots i.on{background:var(--caramel);border-color:var(--caramel)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pinpad button{height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.09);color:#fff;font-size:24px;font-weight:600}
.pinpad button:hover{background:rgba(255,255,255,.16)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.thumbpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.thumbpick button{border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:2px;aspect-ratio:1}
.thumbpick button[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.thumbpick img{width:100%;height:100%;object-fit:contain}
.recipe-row{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;align-items:center}
.editor-stage{position:relative;height:220px;border-radius:var(--r-lg);background:radial-gradient(ellipse at 50% 70%,#fff,#EFE7DE 75%);overflow:hidden}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--caramel-t);color:#5C3D00;border-radius:var(--r-md);padding:11px 14px;margin-bottom:14px;font-size:14px}
.banner.info{background:var(--brand-t);color:var(--deep)}
.banner .btn{margin-left:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body *{visibility:hidden!important}
  #print-area,#print-area *{visibility:visible!important}
  #print-area{position:absolute;left:0;top:0;width:80mm}
  #print-area .receipt{border:0;box-shadow:none;max-width:none}
}

.ar.starting .ar-card,.ar.starting .ar-nav,.ar.starting .ar-tilt,.ar.starting .ar-cats{visibility:hidden}
.placebtn{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:5;box-shadow:0 8px 22px rgba(38,24,15,.22)}
button.chip{border:0;cursor:pointer}
button.chip:hover{background:var(--brand-t2)}

/* customisation, pairings, rewards */
.opts{font-size:12.5px;color:var(--brand);font-weight:600;margin-top:2px}
.optgroup{margin:0 0 14px}
.og-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.og-h .faint{font-size:12.5px}
.og-c{display:flex;flex-wrap:wrap;gap:8px}
.optc{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink-2)}
.optc span{color:var(--ink-3);font-weight:550;font-size:13px}
.optc[aria-checked=true]{border-color:var(--brand);background:var(--brand-t);color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.optc[aria-checked=true] span{color:var(--brand)}
.pairs{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.pair-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pair{border:1px solid var(--line-2);background:#fff;border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:2px;text-align:left}
.pair .pth img{width:100%;aspect-ratio:1;object-fit:contain}
.pair .pn{font-weight:600;font-size:13px;line-height:1.2}
.pair .pp{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:4px}
.pair em{font-style:normal;color:var(--brand);font-weight:650;display:inline-flex;align-items:center;gap:2px}
.rewards .ic{color:var(--caramel-2)}
.cust-foot{text-align:center;padding:26px 16px 8px;font-size:13px;color:var(--ink-3)}
.cust-foot a{color:var(--ink-3)}
/* order status board (TV) */
.tvboard{position:fixed;inset:0;background:var(--deeper);color:#fff;display:grid;grid-template-rows:auto 1fr auto;z-index:70}
.tv-h{display:flex;align-items:center;gap:16px;padding:22px 34px}
.tv-h .plate{font-size:26px}
.tv-h .clock{margin-left:auto;font-size:30px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--caramel)}
.tv-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
.tv-col{padding:10px 34px 24px;min-height:0;overflow:hidden}
.tv-col+.tv-col{border-left:2px solid rgba(255,255,255,.08);background:rgba(213,154,85,.08)}
.tv-col h2{font-size:clamp(22px,2.6vw,38px);font-weight:650;margin:6px 0 18px;display:flex;align-items:center;gap:12px;color:#EDE0D2}
.tv-col.ready h2{color:var(--caramel)}
.tv-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,13vw,220px),1fr));gap:14px}
.tv-nums>p{grid-column:1/-1;margin:0}
.tv-n{border-radius:18px;background:rgba(255,255,255,.07);padding:14px 10px;text-align:center;font-size:clamp(34px,4.4vw,72px);font-weight:750;font-variant-numeric:tabular-nums;line-height:1}
.tv-n small{display:block;font-size:clamp(12px,1.1vw,18px);font-weight:550;color:#D9C6B3;margin-top:8px}
.tv-col.ready .tv-n{background:var(--caramel);color:var(--deeper)}
.tv-col.ready .tv-n small{color:#4A3020}
.tv-n.flash{animation:tvflash 1s ease-in-out 4}
@keyframes tvflash{50%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(255,255,255,.5)}}
.tv-f{padding:14px 34px 20px;color:#CDB9A5;font-size:clamp(14px,1.3vw,20px);display:flex;gap:16px;align-items:center}
.tv-f .btn{margin-left:auto}
.kot .opts{display:block;font-weight:600}
.kot .pick{font-size:12.5px;font-weight:650;color:var(--caramel-ink);background:var(--caramel-t);border-radius:999px;padding:2px 8px}

<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This café menu needs JavaScript turned on.</p></noscript>
<script>window.KM_APP = 'both'; window.KM_CONFIG = {};</script>
<script>
'use strict';
/* E3 - a small dependency-free WebGL1 renderer tuned for food.
   Geometry builders, procedural textures, PBR-ish shading with
   wrap/subsurface, procedural bump + browning, shadow map, shadow
   catcher for AR compositing. */
const E3 = (() => {
  const TAU = Math.PI * 2;

  /* ---------------- random + noise ---------------- */
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const PERM = new Uint8Array(512);
  (() => {
    const r = rng(1337), p = [];
    for (let i = 0; i < 256; i++) p.push(i);
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
    for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
  })();
  const h3 = (x, y, z) => PERM[PERM[PERM[x & 255] + (y & 255)] + (z & 255)] / 255;
  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const L = (a, b, t) => a + (b - a) * t;
    const x0 = L(L(h3(xi, yi, zi), h3(xi + 1, yi, zi), u), L(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), u), v);
    const x1 = L(L(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), u), L(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), u), v);
    return L(x0, x1, w) * 2 - 1;
  }
  function fbm(x, y, z, oct = 4) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
    return s;
  }

  /* ---------------- color ---------------- */
  function hex(h) {
    if (Array.isArray(h)) return h;
    h = h.replace('#', '');
    const n = parseInt(h, 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  const toLin = (c) => hex(c).map((v) => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));

  /* ---------------- vec / mat ---------------- */
  const V = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
    norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
    lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  };
  const M4 = {
    id() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
    mul(a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
        o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
      return o;
    },
    chain(...ms) { return ms.reduce((acc, m) => M4.mul(acc, m)); },
    T(x, y, z) { const m = M4.id(); m[12] = x; m[13] = y; m[14] = z; return m; },
    S(x, y = x, z = x) { const m = M4.id(); m[0] = x; m[5] = y; m[10] = z; return m; },
    Rx(a) { const m = M4.id(), c = Math.cos(a), s = Math.sin(a); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; },
    Ry(a) { const m = M4.id(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; },
    Rz(a) { const m = M4.id(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; },
    // rotation that maps +Y to direction d
    alignY(d) {
      d = V.norm(d);
      const y = [0, 1, 0], c = V.dot(y, d);
      if (c > 0.99999) return M4.id();
      if (c < -0.99999) return M4.Rx(Math.PI);
      const ax = V.norm(V.cross(y, d)), a = Math.acos(c);
      return M4.axisAngle(ax, a);
    },
    axisAngle(ax, a) {
      const [x, y, z] = ax, c = Math.cos(a), s = Math.sin(a), t = 1 - c, m = M4.id();
      m[0] = t * x * x + c; m[1] = t * x * y + s * z; m[2] = t * x * z - s * y;
      m[4] = t * x * y - s * z; m[5] = t * y * y + c; m[6] = t * y * z + s * x;
      m[8] = t * x * z + s * y; m[9] = t * y * z - s * x; m[10] = t * z * z + c;
      return m;
    },
    persp(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far), m = new Float32Array(16);
      m[0] = f / aspect; m[5] = f; m[10] = (far + near) * nf; m[11] = -1; m[14] = 2 * far * near * nf;
      return m;
    },
    ortho(l, r, b, t, n, f) {
      const m = M4.id();
      m[0] = 2 / (r - l); m[5] = 2 / (t - b); m[10] = -2 / (f - n);
      m[12] = -(r + l) / (r - l); m[13] = -(t + b) / (t - b); m[14] = -(f + n) / (f - n);
      return m;
    },
    lookAt(eye, target, up = [0, 1, 0]) {
      let z = V.norm(V.sub(eye, target));
      let x = V.cross(up, z);
      if (V.len(x) < 1e-6) x = V.cross([0, 0, 1], z);
      x = V.norm(x);
      const y = V.cross(z, x), m = new Float32Array(16);
      m[0] = x[0]; m[4] = x[1]; m[8] = x[2];
      m[1] = y[0]; m[5] = y[1]; m[9] = y[2];
      m[2] = z[0]; m[6] = z[1]; m[10] = z[2];
      m[12] = -V.dot(x, eye); m[13] = -V.dot(y, eye); m[14] = -V.dot(z, eye); m[15] = 1;
      return m;
    },
    inv(m) {
      const o = new Float32Array(16);
      const [a00, a01, a02, a03, a10, a11, a12, a13, a20, a21, a22, a23, a30, a31, a32, a33] = m;
      const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10,
        b03 = a01 * a12 - a02 * a11, b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12,
        b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30, b08 = a20 * a33 - a23 * a30,
        b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
      let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
      if (!det) return M4.id();
      det = 1 / det;
      o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det; o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
      o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det; o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
      o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det; o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
      o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det; o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
      o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det; o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
      o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det; o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
      o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det; o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
      o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det; o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
      return o;
    },
    // 3x3 inverse-transpose of the upper-left of m (for normals)
    normal3(m) {
      const a = m[0], b = m[1], c = m[2], d = m[4], e = m[5], f = m[6], g = m[8], h = m[9], i = m[10];
      const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
      const det = a * A + b * B + c * C || 1e-12, s = 1 / det;
      return new Float32Array([
        A * s, -(b * i - c * h) * s, (b * f - c * e) * s,
        B * s, (a * i - c * g) * s, -(a * f - c * d) * s,
        C * s, -(a * h - b * g) * s, (a * e - b * d) * s,
      ]);
    },
    xform(m, p) {
      const x = p[0], y = p[1], z = p[2], w = m[3] * x + m[7] * y + m[11] * z + m[15] || 1;
      return [(m[0] * x + m[4] * y + m[8] * z + m[12]) / w, (m[1] * x + m[5] * y + m[9] * z + m[13]) / w, (m[2] * x + m[6] * y + m[10] * z + m[14]) / w];
    },
  };

  /* ---------------- geometry ---------------- */
  class Geo {
    constructor() { this.p = []; this.n = []; this.uv = []; this.i = []; }
    get count() { return this.p.length / 3; }
    clone() { const g = new Geo(); g.p = this.p.slice(); g.n = this.n.slice(); g.uv = this.uv.slice(); g.i = this.i.slice(); return g; }
    apply(m) {
      const nm = M4.normal3(m);
      for (let k = 0; k < this.p.length; k += 3) {
        const x = this.p[k], y = this.p[k + 1], z = this.p[k + 2];
        this.p[k] = m[0] * x + m[4] * y + m[8] * z + m[12];
        this.p[k + 1] = m[1] * x + m[5] * y + m[9] * z + m[13];
        this.p[k + 2] = m[2] * x + m[6] * y + m[10] * z + m[14];
        const a = this.n[k], b = this.n[k + 1], c = this.n[k + 2];
        let nx = nm[0] * a + nm[3] * b + nm[6] * c, ny = nm[1] * a + nm[4] * b + nm[7] * c, nz = nm[2] * a + nm[5] * b + nm[8] * c;
        const l = Math.hypot(nx, ny, nz) || 1;
        this.n[k] = nx / l; this.n[k + 1] = ny / l; this.n[k + 2] = nz / l;
      }
      // mirrored transforms flip winding
      const det = m[0] * (m[5] * m[10] - m[6] * m[9]) - m[4] * (m[1] * m[10] - m[2] * m[9]) + m[8] * (m[1] * m[6] - m[2] * m[5]);
      if (det < 0) for (let k = 0; k < this.i.length; k += 3) { const t = this.i[k + 1]; this.i[k + 1] = this.i[k + 2]; this.i[k + 2] = t; }
      return this;
    }
    bounds() {
      const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
      for (let k = 0; k < this.p.length; k += 3) for (let a = 0; a < 3; a++) { const v = this.p[k + a]; if (v < mn[a]) mn[a] = v; if (v > mx[a]) mx[a] = v; }
      return { min: mn, max: mx };
    }
  }
  function merge(list) {
    const g = new Geo();
    for (const s of list) {
      if (!s) continue;
      const base = g.count;
      for (const v of s.p) g.p.push(v);
      for (const v of s.n) g.n.push(v);
      for (const v of s.uv) g.uv.push(v);
      for (const v of s.i) g.i.push(v + base);
    }
    return g;
  }

  function computeNormals(g, weld = true) {
    const vc = g.count, acc = new Float64Array(vc * 3);
    let map = null;
    if (weld) {
      map = new Int32Array(vc);
      const keys = new Map();
      for (let v = 0; v < vc; v++) {
        const k = Math.round(g.p[v * 3] * 2e5) + ',' + Math.round(g.p[v * 3 + 1] * 2e5) + ',' + Math.round(g.p[v * 3 + 2] * 2e5);
        let t = keys.get(k);
        if (t === undefined) { t = v; keys.set(k, v); }
        map[v] = t;
      }
    }
    const P = g.p;
    for (let t = 0; t < g.i.length; t += 3) {
      const a = g.i[t], b = g.i[t + 1], c = g.i[t + 2];
      const ux = P[b * 3] - P[a * 3], uy = P[b * 3 + 1] - P[a * 3 + 1], uz = P[b * 3 + 2] - P[a * 3 + 2];
      const vx = P[c * 3] - P[a * 3], vy = P[c * 3 + 1] - P[a * 3 + 1], vz = P[c * 3 + 2] - P[a * 3 + 2];
      const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      for (const v of [a, b, c]) { const d = map ? map[v] : v; acc[d * 3] += nx; acc[d * 3 + 1] += ny; acc[d * 3 + 2] += nz; }
    }
    for (let v = 0; v < vc; v++) {
      const s = map ? map[v] : v;
      const x = acc[s * 3], y = acc[s * 3 + 1], z = acc[s * 3 + 2], l = Math.hypot(x, y, z);
      if (l > 1e-20) { g.n[v * 3] = x / l; g.n[v * 3 + 1] = y / l; g.n[v * 3 + 2] = z / l; }
    }
    return g;
  }

  // Surface of revolution around Y. profile: [[r, y], ...] or [[r, y, nr, ny], ...]
  // A repeated point creates a crease. x = r cos(phi), z = r sin(phi).
  function lathe(profile, o = {}) {
    const segs = o.segs || 48, phi0 = o.phi0 || 0, phiLen = o.phiLen == null ? TAU : o.phiLen;
    const g = new Geo(), n = profile.length, nrm = [];
    const same = (a, b) => a && b && Math.abs(a[0] - b[0]) < 1e-12 && Math.abs(a[1] - b[1]) < 1e-12;
    for (let i = 0; i < n; i++) {
      const p = profile[i];
      if (p.length >= 4) { nrm.push([p[2], p[3]]); continue; }
      let prev = profile[i - 1], next = profile[i + 1];
      if (same(prev, p)) prev = null;
      if (same(next, p)) next = null;
      let tr = 0, ty = 0;
      if (prev) { const dr = p[0] - prev[0], dy = p[1] - prev[1], l = Math.hypot(dr, dy) || 1; tr += dr / l; ty += dy / l; }
      if (next) { const dr = next[0] - p[0], dy = next[1] - p[1], l = Math.hypot(dr, dy) || 1; tr += dr / l; ty += dy / l; }
      if (!prev && !next) ty = 1;
      const l = Math.hypot(tr, ty) || 1;
      nrm.push([ty / l, -tr / l]);
    }
    const lens = [0];
    for (let i = 1; i < n; i++) lens.push(lens[i - 1] + Math.hypot(profile[i][0] - profile[i - 1][0], profile[i][1] - profile[i - 1][1]));
    const total = lens[n - 1] || 1;
    for (let j = 0; j <= segs; j++) {
      const phi = phi0 + (phiLen * j) / segs, c = Math.cos(phi), s = Math.sin(phi);
      for (let i = 0; i < n; i++) {
        let r = profile[i][0];
        const y = profile[i][1];
        if (o.rmod) r *= o.rmod(phi, y, i / (n - 1));
        g.p.push(r * c, y, r * s);
        g.n.push(nrm[i][0] * c, nrm[i][1], nrm[i][0] * s);
        g.uv.push(j / segs, o.vByIndex ? i / (n - 1) : lens[i] / total);
      }
    }
    for (let j = 0; j < segs; j++)
      for (let i = 0; i < n - 1; i++) {
        const a = j * n + i, b = (j + 1) * n + i, c = j * n + i + 1, d = (j + 1) * n + i + 1;
        if (profile[i][0] === 0 && profile[i + 1][0] === 0) continue;
        g.i.push(a, c, b, b, c, d);
      }
    if (o.rmod) computeNormals(g, true);
    return g;
  }
  const arc = (cx, cy, r, a0, a1, n) => { const out = []; for (let k = 0; k <= n; k++) { const a = a0 + ((a1 - a0) * k) / n; out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return out; };

  function sphere(r, ws = 32, hs = 18) {
    const prof = [];
    for (let i = 0; i <= hs; i++) { const t = (Math.PI * i) / hs, s = Math.sin(t), c = -Math.cos(t); prof.push([r * s, r * c, s, c]); }
    return lathe(prof, { segs: ws });
  }
  // dome: spherical cap from equator (y=0) to top, radius r, flattened by k

  function bake(renderer, cpu) {
    if (cpu._baked && cpu._baked.r === renderer) return cpu._baked.m;
    const byMat = new Map();

        if (cm[3]) { c.r = {}; for (const kv of cm[3].split(',')) { const km = /^\s*(\S+)\s+([\d.]+)\s*$/.exec(kv); if (km) c.r[km[1]] = Number(km[2]); } }
        choices.push(c);
      }
      if (choices.length) out.push({ name: m[1].trim(), many: !!m[2], choices });
    }
    return out;
  }

  /* Rewards ("beans"), derived from orders like stock: earned on paid bills, spent when redeemed */
  const cleanPhone = (p) => { const d = String(p || '').replace(/\D/g, '').slice(-10); return d.length === 10 ? d : ''; };
  function beans(phone, orders, s = SETTINGS) {
    const ph = cleanPhone(phone); let earned = 0, spent = 0, pending = 0;
    if (!ph) return { earned, spent, pending, balance: 0 };
    const per = Math.max(1, Number(s.beanPer) || 10) * 100;
    for (const o of orders || []) {
      if (o.phone !== ph || o.status === 'cancelled') continue;
      spent += Number(o.beans) || 0;
      const p = o.pay || {};
      if (p.status === 'paid') earned += Math.floor((o.total || 0) / per);
      else if (p.status !== 'refunded') pending += Math.floor((o.total || 0) / per);
    }
    return { earned, spent, pending, balance: Math.max(0, earned - spent) };
  }

  function defaultMenu() {
    return M.map(([id, name, category, price, veg, model, kcal, prep, from, to, desc, recipe, tags], i) => ({
      id, name, category, price, veg, model, kcal, prep, from, to, desc, tags, active: true, sort: i,
      recipe: Object.entries(recipe).map(([ing, qty]) => ({ ing, qty })),
    }));
  }
  function defaultStock(at = Date.now()) {
    return S.map(([id, name, unit, base, reorder, cost, supplier]) => ({ id, name, unit, base, baseAt: at, reorder, cost, supplier }));
  }

  /* ---------------- money + time ---------------- */
  const INR = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const INR0 = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const NUM = new Intl.NumberFormat('en-IN');
  // paise -> "₹1,234.50" ; whole rupees drop decimals when dec !== true
  function money(paise, dec) {
    const r = (paise || 0) / 100;
    if (dec === true || (dec !== false && Math.round(r) !== r)) return INR.format(r);
    return INR0.format(r);
  }
  const rupees = (p) => money(Math.round(p * 100));
  const compact = (paise) => { const r = paise / 100; if (Math.abs(r) >= 1e7) return '₹' + (r / 1e7).toFixed(2) + ' Cr'; if (Math.abs(r) >= 1e5) return '₹' + (r / 1e5).toFixed(1) + ' L'; if (Math.abs(r) >= 1e3) return '₹' + (r / 1e3).toFixed(1) + 'K'; return INR0.format(r); };
  const toMin = (hhmm) => { const [h, m] = String(hhmm || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
  const pad2 = (n) => String(n).padStart(2, '0');
  const fy = (d = new Date()) => { const y = d.getFullYear() % 100, m = d.getMonth(); return m >= 3 ? `${pad2(y)}-${pad2(y + 1)}` : `${pad2(y - 1)}-${pad2(y)}`; };
  const dayKey = (t) => { const d = new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
  const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const time12 = (t) => new Date(t).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
  const dateShort = (t) => new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  const dateLong = (t) => new Date(t).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  const hm = (hhmm) => { const m = toMin(hhmm), h = Math.floor(m / 60) % 24, mm = m % 60; const ap = h < 12 ? 'am' : 'pm'; const h12 = h % 12 || 12; return mm ? `${h12}:${pad2(mm)} ${ap}` : `${h12} ${ap}`; };

  /* ---------------- billing (integer paise) ---------------- */
  function bill(lines, o = {}) {
    const rate = o.rate == null ? 5 : Number(o.rate), incl = !!o.incl;
    const sub = lines.reduce((s, l) => s + Math.round(Number(l.price) * 100) * l.qty, 0);
    let disc = o.discPct ? Math.round((sub * Number(o.discPct)) / 100) : Math.round(Number(o.disc || 0));
    disc = Math.max(0, Math.min(disc, sub));
    const net = sub - disc;
    let taxable, cgst, sgst;
    if (incl) { taxable = Math.round((net * 100) / (100 + rate)); const tax = net - taxable; cgst = Math.round(tax / 2); sgst = tax - cgst; }
    else { taxable = net; cgst = Math.round((taxable * rate) / 200); sgst = cgst; }
    const gross = taxable + cgst + sgst;
    const total = Math.round(gross / 100) * 100;
    return { sub, disc, taxable, cgst, sgst, round: total - gross, total, rate, incl };
  }

  /* ---------------- stock + availability ---------------- */
  function computeStock(stock, orders, ledger) {
    const map = {};
    for (const s of stock || []) map[s.id] = Object.assign({}, s, { qty: Number(s.base) || 0, used: 0, in: 0, out: 0 });
    for (const e of ledger || []) { const s = map[e.ing]; if (e.type === 'count') continue; if (s && e.at > (s.baseAt || 0)) { s.qty += Number(e.qty) || 0; if (e.qty > 0) s.in += e.qty; else s.out -= e.qty; } }
    for (const o of orders || []) {
      if (o.status === 'cancelled') continue;
      for (const ing in o.use || {}) { const s = map[ing]; if (s && o.createdAt >= (s.baseAt || 0)) { s.qty -= o.use[ing]; s.used += o.use[ing]; } }
    }
    for (const id in map) { const s = map[id]; s.qty = Math.round(s.qty * 1000) / 1000; s.state = s.qty <= 0 ? 'out' : s.qty <= s.reorder ? 'low' : 'ok'; }
    return map;
  }
  function consumption(lines, menuById) {
    const use = {};
    for (const l of lines) { const d = menuById[l.id]; if (!d) continue; for (const r of d.recipe || []) use[r.ing] = (use[r.ing] || 0) + r.qty * l.qty; for (const k in l.xr || {}) use[k] = (use[k] || 0) + l.xr[k] * l.qty; }
    return use;
  }
  function inWindow(d, now) {
    if (!d.from || !d.to) return true;
    const m = now.getHours() * 60 + now.getMinutes(), f = toMin(d.from), t = toMin(d.to);
    return f <= t ? m >= f && m < t : m >= f || m < t;
  }
  // Is a dish orderable right now? reserve = qty already in the cart, per ingredient
  function dishStatus(d, stockMap, settings, now = new Date(), reserve = null) {
    if (!d || d.active === false) return { ok: false, reason: 'off', label: 'Not available today' };
    if ((!settings || settings.timeMenus !== false) && !inWindow(d, now)) return { ok: false, reason: 'time', label: `Served ${hm(d.from)} to ${hm(d.to)}`, short: `From ${hm(d.from)}` };
    let portions = Infinity, short = null;
    for (const r of d.recipe || []) {
      const s = stockMap[r.ing];
      if (!s) continue;
      const have = s.qty - (reserve ? reserve[r.ing] || 0 : 0), n = Math.floor(have / r.qty + 1e-9);
      if (n < portions) { portions = n; short = r.ing; }
    }
    if (portions <= 0) return { ok: false, reason: 'stock', label: 'Sold out', short: 'Sold out', ing: short };
    return { ok: true, portions: portions === Infinity ? null : portions, low: portions !== Infinity && portions <= 5 };
  }
  function foodCost(d, stockById) {
    let c = 0;
    for (const r of d.recipe || []) { const s = stockById[r.ing]; if (s) c += r.qty * (Number(s.cost) || 0); }
    return Math.round(c * 100); // paise
  }

  /* ---------------- ids ---------------- */
  const rid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function orderIds(no, prefix, t = Date.now()) { return { id: `${prefix}-${no}`, inv: `${prefix}/${fy(new Date(t))}/${String(no).padStart(4, '0')}` }; }

  /* ---------------- sample sales ---------------- */
  function sampleOrders(menu, settings, startNo, days = 14) {
    const r = E3.rng(20260419 + startNo);
    const out = [];
    const byCat = {};
    for (const d of menu) (byCat[d.category] = byCat[d.category] || []).push(d);
    const pick = (arr) => arr[Math.floor(r() * arr.length)];
    let no = startNo;
    const now = Date.now();
    for (let day = days; day >= 0; day--) {
      const base = startOfDay(now - day * 864e5);
      const count = day === 0 ? 0 : 5 + Math.floor(r() * 6) + (new Date(base).getDay() % 6 === 0 ? 4 : 0);
      const times = [];
      for (let k = 0; k < count; k++) { const h = 8 + Math.pow(r(), 0.9) * 14; times.push(base + h * 36e5); }
      if (day === 0) { const lim = (now - base) / 36e5; for (let h = 7.6; h < lim - 0.25; h += 0.35 + r() * 0.6) times.push(base + h * 36e5); }
      times.sort((a, b) => a - b);
      for (const t of times) {
        if (t >= now - 60000) continue;
        const hr = new Date(t).getHours();
        const n = 1 + Math.floor(r() * 3), lines = [];
        for (let k = 0; k < n; k++) {
          let cat = hr < 11 ? pick(['Coffee', 'Coffee', 'Tea & coolers', 'Bakery', 'Breakfast', 'Breakfast']) : hr < 16 ? pick(['Coffee', 'Mains', 'Mains', 'Snacks', 'Tea & coolers', 'Desserts']) : pick(['Coffee', 'Mains', 'Snacks', 'Desserts', 'Desserts', 'Tea & coolers']);
          const pool = (byCat[cat] || menu).filter((d) => inWindow(d, new Date(t)));
          const d = pick(pool.length ? pool : menu);
          const ex = lines.find((l) => l.id === d.id);
          if (ex) ex.qty++; else lines.push({ id: d.id, name: d.name, price: d.price, qty: 1 + (r() < 0.2 ? 1 : 0), veg: d.veg, model: d.model, note: '' });
        }
        const b = bill(lines, { rate: settings.gstRate, incl: settings.taxInclusive });
        const pr = r(), method = pr < 0.58 ? 'upi' : pr < 0.82 ? 'card' : 'cash';
        no++;
        const ids = orderIds(no, settings.prefix, t);
        const portal = r() < 0.55;
        out.push(Object.assign({
          id: ids.id, no, inv: ids.inv, createdAt: Math.round(t), table: r() < 0.82 ? 1 + Math.floor(r() * (settings.tables || 12)) : null,
          source: portal ? 'portal' : 'pos', items: lines, status: 'served', use: {}, demo: true, note: '',
          pay: { method, status: 'paid', at: Math.round(t + 6e5), ref: method === 'upi' ? 'UPI' + Math.floor(r() * 1e9) : method === 'card' ? 'TEST' + Math.floor(r() * 1e6) : '', last4: method === 'card' ? String(1000 + Math.floor(r() * 8999)) : '' },
          log: [{ s: 'new', at: Math.round(t) }, { s: 'served', at: Math.round(t + 9e5) }],
        }, b, { type: r() < 0.18 ? 'takeaway' : 'dine-in' }));
      }
    }
    return out;
  }

  /* ---------------- storage ---------------- */
  // Common in-memory state + listeners. Adapters: Cloud (artifact db) or Local (this browser).
  const state = { ready: false, mode: 'local', settings: Object.assign({}, SETTINGS), menu: [], stock: [], orders: [], ledger: [], uid: null, canEdit: true, error: null, synced: false };
  const listeners = new Set();
  let notifyQueued = false;
  function notify() { if (notifyQueued) return; notifyQueued = true; queueMicrotask(() => { notifyQueued = false; for (const fn of listeners) { try { fn(state); } catch (e) { console.error(e); } } }); }
  const on = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
  const sortMenu = (arr) => arr.slice().sort((a, b) => (a.sort ?? 999) - (b.sort ?? 999) || String(a.name).localeCompare(b.name));
  const sortOrders = (arr) => arr.slice().sort((a, b) => b.createdAt - a.createdAt);

  const safeLS = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };

  /* Local adapter (self-hosted or offline): one browser, syncs across its tabs */
  const Local = {
    key: 'km.cafe.v1', chan: null, mem: null,
    load() {
      let d = null;
      try { d = JSON.parse(safeLS.get(this.key) || 'null'); } catch (e) { d = null; }
      let fresh = false;
      if (!d || !Array.isArray(d.menu)) { d = { settings: Object.assign({}, SETTINGS), menu: defaultMenu(), stock: defaultStock(), orders: [], ledger: [], counter: 1000 }; fresh = true; }
      this.mem = d;
      if (fresh) safeLS.set(this.key, JSON.stringify(d));
      this.apply();
    },
    apply() {
      const d = this.mem;
      state.settings = Object.assign({}, SETTINGS, d.settings);
      state.menu = sortMenu(d.menu); state.stock = d.stock.slice(); state.orders = sortOrders(d.orders); state.ledger = d.ledger.slice().sort((a, b) => b.at - a.at);
      notify();
    },
    save(broadcast = true) {
      safeLS.set(this.key, JSON.stringify(this.mem));
      this.apply();
      if (broadcast && this.chan) try { this.chan.postMessage('sync'); } catch (e) { /* ignore */ }
    },
    async init() {
      state.mode = 'local';
      this.load();
      try { this.chan = new BroadcastChannel('km-cafe'); this.chan.onmessage = () => this.load(); } catch (e) { this.chan = null; }
      window.addEventListener('storage', (e) => { if (e.key === this.key) this.load(); });
      state.ready = true; state.synced = true; notify();
    },
    async setSettings(patch) { this.mem.settings = Object.assign({}, this.mem.settings, patch); this.save(); },
    async putDish(d) { const i = this.mem.menu.findIndex((x) => x.id === d.id); if (i >= 0) this.mem.menu[i] = d; else this.mem.menu.push(d); this.save(); },
    async delDish(id) { this.mem.menu = this.mem.menu.filter((x) => x.id !== id); this.save(); },
    async putStock(s) { const i = this.mem.stock.findIndex((x) => x.id === s.id); if (i >= 0) this.mem.stock[i] = s; else this.mem.stock.push(s); this.save(); },
    async delStock(id) { this.mem.stock = this.mem.stock.filter((x) => x.id !== id); this.save(); },
    async nextNo() { this.load(); this.mem.counter = Math.max(this.mem.counter || 1000, ...this.mem.orders.map((o) => o.no || 0)) + 1; this.save(); return this.mem.counter; },
    async putOrder(o) { const i = this.mem.orders.findIndex((x) => x.id === o.id); if (i >= 0) this.mem.orders[i] = o; else this.mem.orders.push(o); this.save(); },
    async patchOrder(id, patch) { const o = this.mem.orders.find((x) => x.id === id); if (o) { Object.assign(o, patch); this.save(); } },
    async putOrders(list) { for (const o of list) { const i = this.mem.orders.findIndex((x) => x.id === o.id); if (i >= 0) this.mem.orders[i] = o; else this.mem.orders.push(o); } this.save(); },
    async delOrders(ids) { const s = new Set(ids); this.mem.orders = this.mem.orders.filter((o) => !s.has(o.id)); this.save(); },
    async addLedger(e) { this.mem.ledger.push(e); this.save(); },
    async seed() { this.mem.menu = defaultMenu(); this.mem.stock = defaultStock(); this.save(); },
    async reset() { this.mem = { settings: Object.assign({}, SETTINGS), menu: defaultMenu(), stock: defaultStock(), orders: [], ledger: [], counter: 1000 }; this.save(); },
  };

  /* Cloud adapter: the artifact's shared database (all signed-in viewers, live) */
  const Cloud = {
    db: null, unsubs: [], writing: new Map(), holder: rid('tab'),
    // one write at a time per document
    write(path, fn) {
      const prev = this.writing.get(path) || Promise.resolve();
      const next = prev.catch(() => {}).then(fn);
      this.writing.set(path, next);
      return next.catch((e) => { handleWriteError(e); throw e; });
    },
    async init(db, user) {
      this.db = db;
      state.mode = 'cloud';
      try { state.uid = user ? await user.id() : null; } catch (e) { state.uid = null; }
      try { if (user && user.canEdit) state.canEdit = !!(await user.canEdit()); } catch (e) { /* keep default */ }
      let got = 0;
      const timer = setTimeout(() => { if (!state.synced) { state.error = 'slow'; notify(); } }, 10000);
      const mark = (snap) => { if (snap && snap.metadata && !snap.metadata.fromCache) { got++; if (got >= 3) { state.synced = true; state.error = null; clearTimeout(timer); } } state.ready = true; notify(); };
      const fail = (e) => { state.error = (e && e.code) || 'unavailable'; state.ready = true; clearTimeout(timer); notify(); };
      this.unsubs.push(db.doc('cafe/settings').onSnapshot((s) => { state.settings = Object.assign({}, SETTINGS, s.exists ? s.data() : {}); mark(s); }, fail));
      this.unsubs.push(db.collection('menu').onSnapshot((s) => { state.menu = sortMenu(s.docs.map((d) => Object.assign({ id: d.id }, d.data()))); mark(s); }, fail));
      this.unsubs.push(db.collection('stock').onSnapshot((s) => { state.stock = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); mark(s); }, fail));
      this.unsubs.push(db.collection('orders').orderBy('createdAt', 'desc').limit(800).onSnapshot((s) => { state.orders = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); mark(s); }, fail));
      this.unsubs.push(db.collection('ledger').orderBy('at', 'desc').limit(400).onSnapshot((s) => { state.ledger = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); mark(s); }, fail));
    },
    clean(o) { return JSON.parse(JSON.stringify(o)); },
    setSettings(patch) { const next = Object.assign({}, state.settings, patch); return this.write('cafe/settings', () => this.db.doc('cafe/settings').set(this.clean(next))); },
    putDish(d) { const { id, ...rest } = d; return this.write('menu/' + id, () => this.db.doc('menu/' + id).set(this.clean(rest))); },
    delDish(id) { return this.write('menu/' + id, () => this.db.doc('menu/' + id).delete()); },
    putStock(s) { const { id, qty, used, in: _i, out: _o, state: _s, ...rest } = s; return this.write('stock/' + id, () => this.db.doc('stock/' + id).set(this.clean(rest))); },
    delStock(id) { return this.write('stock/' + id, () => this.db.doc('stock/' + id).delete()); },
    async nextNo() {
      const ref = this.db.doc('meta/counter');
      const floor = Math.max(1000, ...state.orders.map((o) => o.no || 0));
      for (let attempt = 0; attempt < 8; attempt++) {
        let lease = { acquired: true };
        try { lease = await ref.acquire({ holder: this.holder, ttlMs: 5000 }); } catch (e) { lease = { acquired: true }; }
        if (lease.acquired) {
          const snap = await ref.get();
          const cur = Math.max(floor, snap.exists ? Number(snap.data().no) || 0 : 0);
          const no = cur + 1;
          await ref.set({ no, at: Date.now() });
          return no;
        }
        await new Promise((res) => setTimeout(res, 250 + Math.random() * 500));
      }
      return floor + 1 + Math.floor(Math.random() * 50);
    },
    putOrder(o) { const { id, ...rest } = o; return this.write('orders/' + id, () => this.db.doc('orders/' + id).set(this.clean(rest))); },
    patchOrder(id, patch) { return this.write('orders/' + id, () => this.db.doc('orders/' + id).update(this.clean(patch))); },
    // bulk writes go straight to the store with retry + backoff, so a rate limit pauses instead of failing
    async retry(fn, n = 5) {
      for (let k = 0; ; k++) {
        try { return await fn(); } catch (e) {
          const code = e && e.code;
          if (k >= n || !(code === 'resource_exhausted' || code === 'unavailable')) throw e;
          await new Promise((r) => setTimeout(r, 700 * Math.pow(2, k) + Math.random() * 400));
        }
      }
    },
    async putOrders(list, progress) { let i = 0; for (const o of list) { const { id, ...rest } = o; await this.retry(() => this.db.doc('orders/' + id).set(this.clean(rest))); if (++i % 20 === 0 && progress) progress(i, list.length); } },
    async delOrders(ids, progress) { let i = 0; for (const id of ids) { await this.retry(() => this.db.doc('orders/' + id).delete()); if (++i % 20 === 0 && progress) progress(i, ids.length); } },
    addLedger(e) { const { id, ...rest } = e; return this.write('ledger/' + id, () => this.db.doc('ledger/' + id).set(this.clean(rest))); },
    async seed() {
      for (const d of defaultMenu()) await this.putDish(d);
      for (const s of defaultStock()) await this.putStock(s);
      if (!state.settings || !state.settings._saved) await this.setSettings({ _saved: true });
    },
  };

  /* Supabase adapter (your own hosting): set window.KM_CONFIG = { supabaseUrl, supabaseKey } (see config.example.json).
     Tables hold one jsonb `data` column per row plus a few indexed columns; schema in supabase/schema.sql.
     Live updates come from Supabase Realtime, so a portal order shows on the kitchen board straight away. */
  const Supa = {
    sb: null, chan: null, rows: { settings: null, dishes: new Map(), ingredients: new Map(), orders: new Map(), stock_movements: new Map() },
    async init(cfg) {
      state.mode = 'connecting'; state.backend = 'supabase'; notify();
      const mod = await import(cfg.supabaseLib || 'https://esm.sh/@supabase/supabase-js@2');
      this.sb = mod.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true } });
      try { const { data } = await this.sb.auth.getSession(); state.staffUser = data && data.session ? data.session.user.email : null; } catch (e) { state.staffUser = null; }
      this.sb.auth.onAuthStateChange((_e, sess) => { state.staffUser = sess ? sess.user.email : null; notify(); });
      this.chan = this.sb.channel('cafe');
      for (const t of ['settings', 'dishes', 'ingredients', 'orders', 'stock_movements']) {
        this.chan.on('postgres_changes', { event: '*', schema: 'public', table: t }, (ev) => this.change(t, ev));
      }
      this.chan.subscribe((st) => { if (st === 'SUBSCRIBED') { state.error = null; } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { state.error = 'unavailable'; } notify(); });
      await this.reload();
      state.mode = 'cloud'; state.ready = true; state.synced = true; notify();
      // re-read after the tab wakes up, in case events were missed while asleep
      document.addEventListener('visibilitychange', () => { if (!document.hidden) this.reload().catch(() => {}); });
    },
    async reload() {
      const q = (t, f) => f(this.sb.from(t).select('id,data')).then((r) => { if (r.error) throw r.error; return r.data; });
      const [st, ds, ing, ord, led] = await Promise.all([
        q('settings', (x) => x.eq('id', 'cafe')), q('dishes', (x) => x), q('ingredients', (x) => x),
        q('orders', (x) => x.order('created_at', { ascending: false }).limit(800)), q('stock_movements', (x) => x.order('at', { ascending: false }).limit(400)),

    if (!keys.length) return `<div class="empty">${icon('search')}<h2>No dishes match</h2><p>Try another word or clear the filters.</p><button class="btn ghost" data-act="clear">Clear filters</button></div>`;
    return keys.map((k) => {
      const list = groups[k].map((d) => ({ d, s: status(d) })).sort((a, b) => (b.s.ok - a.s.ok));
      const avail = list.filter((x) => x.s.ok).length;
      return `<section aria-labelledby="sec-${esc(k)}"><div class="sec-h"><h2 id="sec-${esc(k)}">${esc(k)}</h2><span>${avail} of ${list.length} available now</span></div>

    }).join('');
  }

      <div class="dish-r"><div class="dish-p">${D.rupees(d.price)}</div>${act}${s.ok && s.low ? `<div class="leftlbl">Only ${s.portions} left</div>` : ''}</div>

  function billsView() {
    const list = myOrders();

          <div style="display:grid;gap:6px;justify-items:end"><div class="tot">${D.money(o.total)}</div><div class="chips">${statusChip(o)}${payChip(o)}</div></div></button>`;
