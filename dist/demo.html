  /* ---------- render ---------- */
  function render() {
    if (!root) return;
    const scroll = window.scrollY;
    const html = view === 'cart' ? cartView() : view === 'bills' ? billsView() : menuView();
    root.innerHTML = `<div class="cust" data-view="${view}">${html}${cartbar()}${nav()}</div>`;
    if (view === 'menu' || view === 'ar') mountHero();
    if (view === 'menu') window.scrollTo(0, scroll); else window.scrollTo(0, 0);
  }
  function mountHero() {
    if (AR.isOpen() || openSheet) return;
    const el = $('[data-stage=hero]', root);
    if (!el || !Viewer.ok()) return;
    Viewer.mount(el, Viewer.studio({ key: heroKey || 'cappuccino', table: true, fit: 1.12, el: 0.52, az: 0.4, interactive: false }));
  }
  // light refresh of counts without rebuilding the whole page
  function refreshBits() {
    if (!root) return;
    if (view === 'menu') {
      const list = $('#menu-list', root); if (list) list.innerHTML = menuList();
      const old = $('.cartbar', root); if (old) old.remove();
      const cb = cartbar(); if (cb) $('.cust', root).insertAdjacentHTML('beforeend', cb);
      const nv = $('.bnav', root); if (nv) nv.outerHTML = nav();
    } else if (view === 'cart') render();
    if (AR.isOpen()) AR.refresh();
    if (openSheet && openSheet.refresh) openSheet.refresh();
  }

  /* ---------- AR ---------- */
  function arDishes() {
    const all = S().menu.filter((d) => status(d).ok && (!vegOnly || d.veg));
    return arCat && arCat !== 'All' ? all.filter((d) => d.category === arCat) : all;
  }
  let arCat = 'All';
  function openAR(startId) {
    AR.open({
      dishes: arDishes(), startId, categories: cats().filter((c) => S().menu.some((d) => d.category === c && status(d).ok)), category: arCat,
      getQty: qty, status, cartCount: lineCount, cartTotal: () => cartBill().sub,
      onAdd: (d, n) => { if (add(d, n) && n > 0) toast(`${d.name} added`, 'ok', 1400); },
      onClose: () => { location.hash = 'menu'; },
      onCart: () => { location.hash = 'cart'; },
      onCategory: (c) => { arCat = c; AR.update({ dishes: arDishes(), category: c }); },
    });

  /* ---------- sheets ---------- */
  function dishSheet(id) {
    const d = X().menuById[id]; if (!d) return;
    let n = 1, note = '';
    const groups = D.optionGroups(d), picks = {};
    groups.forEach((g, gi) => { picks[gi] = g.many ? [] : [0]; });
    const m = modal({
      title: d.name, cls: 'dish-sheet',
      body: `<div class="dsheet-stage"><div class="stage" data-stage="detail"></div><span class="hint">Drag to turn, pinch to zoom</span><a class="btn white sm" href="#ar" data-view-ar style="position:absolute;top:12px;right:14px;box-shadow:0 2px 8px rgba(62,42,30,.15)">${icon('camera', 'sm')}See it on my table</a></div>
        <div style="margin-top:14px" data-info></div>`,
      foot: '',
      onClose: () => { openSheet = null; Viewer.unmount($('[data-stage=detail]', m.el)); mountHero(); },
    });
    openSheet = m;
    // "Goes well with": available dishes from other categories, bestsellers first
    const pairs = () => S().menu.filter((x) => x.id !== d.id && x.category !== d.category && status(x).ok)
      .sort((a, b) => ((b.tags || []).includes('Bestseller') - (a.tags || []).includes('Bestseller')) || a.price - b.price).slice(0, 3);
    const draw = () => {
      const s = status(d), sel = D.resolveOpts(d, picks), unit = d.price + sel.add;
      const pr = pairs();
      $('[data-info]', m.el).innerHTML = `<div class="row" style="align-items:flex-start"><div class="grow"><div class="dish-n" style="font-size:20px">${vmark(d.veg)}<span>${esc(d.name)}</span></div>
          <div class="kv" style="margin-top:6px">${d.kcal ? `<span>${icon('flame', 'sm')}${d.kcal} kcal</span>` : ''}${d.prep ? `<span>${icon('clock', 'sm')}${d.prep} min</span>` : ''}${(d.tags || []).map((t) => `<span class="chip new">${esc(t)}</span>`).join('')}</div></div>
          <div class="dish-p" style="font-size:21px">${D.rupees(unit)}</div></div>
        <p class="muted" style="margin:10px 0 14px">${esc(d.desc || '')}</p>
        ${s.ok ? `${groups.map((g, gi) => `<div class="optgroup"><div class="og-h"><b>${esc(g.name)}</b><span class="faint">${g.many ? 'Choose any' : 'Choose one'}</span></div>
            <div class="og-c" role="${g.many ? 'group' : 'radiogroup'}" aria-label="${esc(g.name)}">${g.choices.map((c, ci) => `<button class="optc" data-og="${gi}" data-oc="${ci}" role="${g.many ? 'checkbox' : 'radio'}" aria-checked="${picks[gi].includes(ci)}">${esc(c.n)}${c.p ? `<span>+${D.rupees(c.p)}</span>` : ''}</button>`).join('')}</div></div>`).join('')}
          <label class="field"><span>Note for the kitchen</span><input class="in" maxlength="80" placeholder="Less ice, no onion, extra hot" data-note-in value="${esc(note)}"></label>
          ${pr.length ? `<div class="pairs"><b>Goes well with</b><div class="pair-row">${pr.map((x) => `<button class="pair" data-pair="${x.id}"><span class="pth">${Viewer.img(x.model, '')}</span><span class="pn">${esc(x.name)}</span><span class="pp">${D.rupees(x.price)} ${qty(x.id) ? `<em>${qty(x.id)} in order</em>` : `<em>${icon('plus', 'sm')}Add</em>`}</span></button>`).join('')}</div></div>` : ''}`
        : `<div class="banner">${icon('clock')}<span>${esc(s.label)}.${s.reason === 'stock' ? ' The kitchen has run out for today.' : ''}</span></div>`}`;
      const f = m.foot;
      f.style.justifyContent = 'space-between';
      f.innerHTML = s.ok ? `<div class="stepper lg"><button data-sdec aria-label="One less">${icon('minus')}</button><span>${n}</span><button data-sinc aria-label="One more">${icon('plus')}</button></div><button class="btn saffron grow" data-sadd>Add to order ${D.money(Math.round(unit * 100) * n)}</button>` : `<button class="btn ghost block" data-x-close>Close</button>`;
      const ni = $('[data-note-in]', m.el); if (ni) ni.oninput = (e) => { note = e.target.value; };
    };
    draw();
    m.refresh = draw;
    m.el.addEventListener('click', (e) => {
      const oc = e.target.closest('[data-oc]');
      if (oc) {
        const gi = +oc.dataset.og, ci = +oc.dataset.oc, g = groups[gi];
        if (g.many) picks[gi] = picks[gi].includes(ci) ? picks[gi].filter((x) => x !== ci) : picks[gi].concat(ci); else picks[gi] = [ci];
        draw(); return;
      }
      const pa = e.target.closest('[data-pair]');
      if (pa) { const x = X().menuById[pa.dataset.pair]; if (x && add(x, 1)) { toast(`${x.name} added`, 'ok', 1400); draw(); } return; }
      if (e.target.closest('[data-sinc]')) { n = Math.min(20, n + 1); draw(); }
      if (e.target.closest('[data-sdec]')) { n = Math.max(1, n - 1); draw(); }
      if (e.target.closest('[data-sadd]')) {
        const sel = D.resolveOpts(d, picks);
        let okc = 0; for (let k = 0; k < n; k++) if (add(d, 1, note.trim(), sel)) okc++;
        if (okc) { toast(`${okc} × ${d.name} added`); m.close(); }
      }
      if (e.target.closest('[data-x-close]')) m.close();
      if (e.target.closest('[data-view-ar]')) { e.preventDefault(); m.close(); pendingStart = d.id; location.hash = 'ar'; if (view === 'ar') { AR.close(); openAR(d.id); } }
    });
    setTimeout(() => Viewer.mount($('[data-stage=detail]', m.el), Viewer.studio({ key: d.model, fit: 0.86, el: 0.55 })), 30);
  }
  let pendingStart = null;

  function tableSheet() {

    const m = modal({

      body: `<div class="seg" style="margin-bottom:14px"><button data-tt="dine-in" aria-pressed="${cart.type === 'dine-in'}">Dine-in</button><button data-tt="takeaway" aria-pressed="${cart.type === 'takeaway'}">Takeaway</button></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px" ${cart.type === 'takeaway' ? 'hidden' : ''} data-tables>${Array.from({ length: n }, (_, i) => `<button class="btn ${cart.table === i + 1 ? '' : 'ghost'}" data-t="${i + 1}">${i + 1}</button>`).join('')}</div>

  /* ---------- placing orders ---------- */
  async function createOrder(pay) {
    const s = S().settings, lines = cartLines();
    const b = cartBill();
    const no = await D.api.nextNo();
    const now = Date.now();
    const ids = D.orderIds(no, s.prefix || 'KM', now);
    const order = Object.assign({
      id: ids.id, no, inv: ids.inv, createdAt: now, table: cart.type === 'dine-in' ? cart.table : null, type: cart.type,
      source: 'portal', customer: me(), items: lines.map((l) => ({ id: l.id, name: l.name, price: l.price, qty: l.qty, note: l.note || '', veg: l.veg, model: l.model, opts: l.opts || [] })),
      status: 'new', log: [{ s: 'new', at: now }], use: D.consumption(lines, X().menuById), pay, note: '',
    }, b);
    const ph = D.cleanPhone(cart.phone); if (ph && S().settings.loyalty !== false) { order.phone = ph; if (b.disc) order.beans = Number(S().settings.redeemBeans) || 100; }
    if (cart.type === 'takeaway' && cart.pickup) order.pickupAt = now + cart.pickup * 60000;
    await D.api.putOrder(order);
    cart.lines = []; cart.redeem = false; cart.pickup = 0; saveCart();
    lastSeen[order.id] = 'new';
    return order;
  }
  function checkBeforePay() {
    if (!cartLines().length) return false;
    if (cart.type === 'dine-in' && !cart.table) { toast('Choose your table first', 'warn'); tableSheet(); return false; }
    if (cart.phone && !D.cleanPhone(cart.phone)) { toast('Check the phone number, or leave it empty', 'warn'); return false; }
    const total = {};
    for (const l of cartLines()) { const d = X().menuById[l.id]; for (const r of d.recipe || []) total[r.ing] = (total[r.ing] || 0) + r.qty * l.qty; }
    const sm = X().stockMap;
    for (const ing in total) if (sm[ing] && sm[ing].qty < total[ing] - 1e-9) { toast('Some dishes just ran out. Please review your order.', 'warn'); render(); return false; }
    for (const l of cartLines()) if (!status(X().menuById[l.id]).ok) { toast(`${l.name} is not available right now`, 'warn'); return false; }
    return true;
  }
  async function place() {
    if (!checkBeforePay()) return;
    const total = cartBill().total;
    if (payMethod === 'card') return cardSheet(total);
    if (payMethod === 'upi') return upiSheet(total);
    const btn = $('[data-act=place]', root); if (btn) { btn.disabled = true; btn.textContent = 'Placing order…'; }
    try { const o = await createOrder({ method: 'counter', status: 'unpaid' }); placed(o); }
    catch (e) { toast('Could not place the order. Check your connection and try again.', 'bad'); render(); }
  }
  const upiLink = (amount, ref, note) => { const s = S().settings; return `upi://pay?pa=${encodeURIComponent((s.upiId || '').trim().toLowerCase()).replace('%40', '@')}&pn=${encodeURIComponent(s.upiName || s.name)}&am=${(amount / 100).toFixed(2)}&cu=INR&tn=${encodeURIComponent(note)}&tr=${encodeURIComponent(ref)}`; };
  function upiSheet(total, existing) {
    const s = S().settings, ref = existing ? existing.id : (s.prefix || 'KM') + 'T' + Date.now().toString(36).toUpperCase().slice(-6);
    const link = upiLink(total, ref, existing ? `Order ${existing.id}` : `${s.name} ${cart.type === 'dine-in' && cart.table ? 'Table ' + cart.table : 'order'}`);
    const m = modal({
      title: `Pay ${D.money(total)} by UPI`,
      body: `<div class="upi-box"><div class="qr">${QR.svg(link, { margin: 1, dark: '#3E2A1E' })}</div>
          <b>Scan with any UPI app</b><span class="muted" style="text-align:center">Paying ${esc(s.upiName || s.name)}<br>UPI ID <b>${esc(s.upiId)}</b>, reference ${esc(ref)}</span>
          <a class="btn quiet" href="${esc(link)}">${icon('upi')}Open a UPI app on this phone</a></div>
        <div class="testnote" style="margin-top:12px">${icon('info', 'sm')}<span>After paying, tap “I’ve paid”. Staff confirm UPI payments in their app before marking the bill paid.</span></div>`,
      actions: existing ? [{ label: 'Close' }, { label: 'I’ve paid', cls: 'saffron', onClick: async () => { await D.api.patchOrder(existing.id, { pay: Object.assign({}, existing.pay, { method: 'upi', status: 'pending', ref, claimed: true, claimedAt: Date.now() }) }); toast('Thanks. Staff will confirm your payment.'); } }]
        : [{ label: 'Pay at counter instead', cls: 'ghost', onClick: async () => { const o = await createOrder({ method: 'counter', status: 'unpaid' }); placed(o); } },
          { label: 'I’ve paid', cls: 'saffron', onClick: async (mm) => { const b = mm.foot.lastChild; b.disabled = true; b.textContent = 'Placing order…'; try { const o = await createOrder({ method: 'upi', status: 'pending', ref, claimed: true, claimedAt: Date.now() }); placed(o); } catch (e) { toast('Could not place the order. Try again.', 'bad'); b.disabled = false; b.textContent = 'I’ve paid'; return false; } } }],
    });
    return m;
  }
  const luhn = (num) => { let s = 0, alt = false; for (let i = num.length - 1; i >= 0; i--) { let n = +num[i]; if (alt) { n *= 2; if (n > 9) n -= 9; } s += n; alt = !alt; } return s % 10 === 0; };
  const brand = (n) => /^4/.test(n) ? 'Visa' : /^(5[1-5]|2(2[2-9]|[3-6]\d|7[01]|720))/.test(n) ? 'Mastercard' : /^(60|65|81|82|508)/.test(n) ? 'RuPay' : /^3[47]/.test(n) ? 'Amex' : '';
  function cardSheet(total, existing) {
    const m = modal({
      title: `Pay ${D.money(total)} by card`,
      body: `<div class="testnote" style="margin-bottom:14px">${icon('info', 'sm')}<span>Test mode, no money moves. Use card 4111 1111 1111 1111 with any future expiry and CVV. Card numbers are never stored.</span></div>
        <form class="cardform" novalidate>
          <label class="field"><span>Card number <b data-brand style="color:var(--brand)"></b></span><input class="in cardnum" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="23" data-cn autofocus></label>
          <div class="grid2"><label class="field"><span>Expiry</span><input class="in" inputmode="numeric" placeholder="MM/YY" maxlength="5" autocomplete="cc-exp" data-ce></label>
          <label class="field"><span>CVV</span><input class="in" inputmode="numeric" maxlength="4" placeholder="123" autocomplete="cc-csc" data-cv></label></div>
          <label class="field"><span>Name on card</span><input class="in" autocomplete="cc-name" data-cnm></label>
          <div data-err style="color:var(--danger);font-size:13.5px;min-height:18px"></div>
        </form>`,
      actions: [{ label: 'Cancel' }, { label: `Pay ${D.money(total)}`, cls: 'saffron', onClick: (mm) => payCard(mm, total, existing) }],
    });
    const cn = $('[data-cn]', m.el), ce = $('[data-ce]', m.el);
    cn.addEventListener('input', () => { const d = cn.value.replace(/\D/g, '').slice(0, 19); cn.value = d.replace(/(\d{4})(?=\d)/g, '$1 '); $('[data-brand]', m.el).textContent = brand(d); });
    ce.addEventListener('input', () => { let d = ce.value.replace(/\D/g, '').slice(0, 4); if (d.length >= 3) d = d.slice(0, 2) + '/' + d.slice(2); ce.value = d; });
    $('form', m.el).addEventListener('submit', (e) => e.preventDefault());
  }
  async function payCard(m, total, existing) {
    const num = $('[data-cn]', m.el).value.replace(/\D/g, ''), exp = $('[data-ce]', m.el).value, cvv = $('[data-cv]', m.el).value.replace(/\D/g, '');
    const err = $('[data-err]', m.el), fail = (msg, sel) => { err.textContent = msg; $$('.in', m.el).forEach((i) => i.classList.remove('err')); if (sel) $(sel, m.el).classList.add('err'); return false; };
    if (num.length < 13 || !luhn(num)) return fail('Check the card number.', '[data-cn]');
    const [mm, yy] = exp.split('/').map(Number), now = new Date();
    if (!mm || mm > 12 || yy == null || isNaN(yy) || new Date(2000 + yy, mm, 1) <= now) return fail('Check the expiry date.', '[data-ce]');
    if (cvv.length < 3) return fail('Enter the 3 or 4 digit CVV.', '[data-cv]');
    const btn = m.foot.lastChild; btn.disabled = true; btn.textContent = 'Processing…'; err.textContent = '';
    await new Promise((r) => setTimeout(r, 1100));
    if (num === '4000000000000002') { btn.disabled = false; btn.textContent = `Pay ${D.money(total)}`; return fail('The bank declined this card. Try another card or pay by UPI.'); }
    const pay = { method: 'card', status: 'paid', last4: num.slice(-4), brand: brand(num), ref: 'TEST' + Date.now().toString(36).toUpperCase().slice(-7), at: Date.now() };
    try {
      if (existing) { await D.api.patchOrder(existing.id, { pay }); toast('Payment received'); m.close(); return false; }
      const o = await createOrder(pay); m.close(); placed(o);
    } catch (e) { btn.disabled = false; btn.textContent = `Pay ${D.money(total)}`; return fail('Could not save the order. Try again.'); }
    return false;
  }
  function placed(o) {
    UI.closeAll();
    location.hash = 'bills';
    setTimeout(() => orderSheet(o.id, true), 60);
  }

  /* ---------- order detail / counter ---------- */
  function orderSheet(id, justPlaced) {
    const m = modal({ title: justPlaced ? 'Order placed' : 'Order details', body: '<div data-od></div>', foot: '', onClose: () => { openSheet = null; } });
    openSheet = m;
    const draw = () => {
      const o = S().orders.find((x) => x.id === id);

      const payLine = o.status === 'cancelled' ? 'This order was cancelled.' : p.status === 'paid' ? (p.method === 'card' ? `Paid by ${esc(p.brand || 'card')} ending ${esc(p.last4)}` : p.method === 'upi' ? 'Paid by UPI' : p.method === 'cash' ? 'Paid in cash' : 'Paid') : p.status === 'pending' ? 'UPI payment sent. Staff are confirming it.' : p.status === 'refunded' ? 'Refunded' : 'Not paid yet. Pay now or at the counter.';
      const maxPrep = Math.max(3, ...(o.items || []).map((l) => (X().menuById[l.id] || {}).prep || 5));
      const eta = o.createdAt + maxPrep * 60000;
      $('[data-od]', m.el).innerHTML = `
        <div class="row" style="align-items:flex-end"><div><div class="faint" style="font-size:13px">Order ID</div><div class="bigid">${esc(o.id)}</div></div><span class="grow"></span>${statusChip(o)}</div>
        ${o.status === 'cancelled' ? '' : `<div class="tracker" style="margin-top:14px" aria-label="Order progress">${STEPS.map((s2, i) => `<div class="${i < idx || o.status === 'served' ? 'done' : i === idx ? 'done now' : ''}">${s2[1]}</div>`).join('')}</div>
        <p class="faint" style="font-size:13px;margin:4px 0 0">${o.status === 'served' ? 'Served. Enjoy your meal.' : o.status === 'ready' ? (o.type === 'takeaway' ? `Ready. Collect it at the counter with ${esc(o.id)}.` : 'Ready. It is on its way to you.') : o.pickupAt ? `Timed for pickup at ${D.time12(o.pickupAt)}` : `Usually ready by ${D.time12(eta)}`}</p>`}
        <div class="panel" style="margin-top:14px">${(o.items || []).map((l) => `<div class="cart-line"><span>${Viewer.img(l.model || (X().menuById[l.id] || {}).model || 'cappuccino', '')}</span><div><div class="dish-n" style="font-size:15px">${vmark(l.veg !== false)}<span>${esc(l.name)}</span></div>${optLine(l)}${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}<div class="faint money" style="font-size:13px">${l.qty} × ${D.rupees(l.price)}</div></div><b class="money">${D.money(Math.round(l.price * 100) * l.qty)}</b></div>`).join('')}</div>
        <table class="sumtbl" style="margin-top:12px"><tbody>
          <tr class="sub"><td>Item total</td><td>${D.money(o.sub, true)}</td></tr>
          ${o.disc ? `<tr class="sub"><td>${o.beans ? 'Rewards' : 'Discount'}</td><td>−${D.money(o.disc, true)}</td></tr>` : ''}
          <tr class="sub"><td>CGST ${o.rate / 2}%</td><td>${D.money(o.cgst, true)}</td></tr><tr class="sub"><td>SGST ${o.rate / 2}%</td><td>${D.money(o.sgst, true)}</td></tr>
          ${o.round ? `<tr class="sub"><td>Round off</td><td>${o.round > 0 ? '+' : '−'}${D.money(Math.abs(o.round), true)}</td></tr>` : ''}
          <tr class="total"><td>Total</td><td>${D.money(o.total)}</td></tr></tbody></table>
        <div class="note-line">${icon(p.status === 'paid' ? 'check' : 'info', 'sm')}<span>${payLine}</span></div>
        <p class="faint" style="font-size:12.5px;margin:2px 0 0">${D.dateShort(o.createdAt)}, ${D.time12(o.createdAt)}${o.table ? `, Table ${o.table}` : ''}, ${o.type === 'takeaway' ? 'Takeaway' : 'Dine-in'}. Invoice ${esc(o.inv || o.id)}</p>`;
      const unpaid = o.status !== 'cancelled' && (p.status === 'unpaid' || (p.status === 'pending' && !p.claimed));
      m.foot.style.flexWrap = 'wrap';
      m.foot.innerHTML = `<button class="btn ghost sm" data-o="counter">${icon('qr', 'sm')}Show at counter</button>
        <button class="btn ghost sm" data-o="bill">${icon('download', 'sm')}Bill</button>
        <button class="btn ghost sm" data-o="again">${icon('refresh', 'sm')}Order again</button>
        ${unpaid ? `<button class="btn saffron sm" data-o="pay">Pay ${D.money(o.total)}</button>` : ''}`;
    };
    draw(); m.refresh = draw;
    m.el.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-o]'); if (!b) return;
      const o = S().orders.find((x) => x.id === id); if (!o) return;
      if (b.dataset.o === 'counter') counterSheet(o);
      if (b.dataset.o === 'bill') UI.download(`${o.id}-bill.html`, Invoice.html(o, S().settings), 'text/html');
      if (b.dataset.o === 'again') { let n = 0; for (const l of o.items || []) { const d = X().menuById[l.id]; if (d) for (let k = 0; k < l.qty; k++) if (add(d, 1, l.note || '', l.opts && l.opts.length ? optsSel(d, l.opts) : null)) n++; } if (n) { m.close(); location.hash = 'cart'; } }
      if (b.dataset.o === 'pay') {

        mm.el.addEventListener('click', (ev) => { const x = ev.target.closest('[data-pm]'); if (!x) return; mm.close(); if (x.dataset.pm === 'upi') upiSheet(o.total, o); else cardSheet(o.total, o); });

  // rebuild a selection from saved option names (for "Order again")

  function counterSheet(o) {

        <div style="font-size:20px;font-weight:700" class="money">${D.money(o.total)}</div><div class="muted">${o.table ? `Table ${o.table}` : 'Takeaway'}, ${((n) => `${n} item${n === 1 ? '' : 's'}`)((o.items || []).reduce((s2, l) => s2 + l.qty, 0))}</div></div>`,

  /* ---------- live status updates for my orders ---------- */
  function watchMine() {
    for (const o of myOrders()) {
      const prev = lastSeen[o.id];
      if (prev && prev !== o.status) {
        if (o.status === 'ready') { toast(o.type === 'takeaway' ? `Order ${o.id} is ready to collect` : `Order ${o.id} is ready`, 'ok', 6000); UI.chime(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ } }

    if (inc) { const d = X().menuById[inc.dataset.inc]; if (d) { const last = cart.lines.filter((l) => l.id === d.id).pop(); if (hasOpts(d) && !last) dishSheet(d.id); else if (last) add(d, 1, last.note, lineSel(last)); else add(d, 1); } return; }

    if (ld) { const l = cart.lines[+ld.dataset.ldec]; if (l) { l.qty--; if (l.qty <= 0) cart.lines.splice(+ld.dataset.ldec, 1); saveCart(); render(); } return; }
    const nt = t.closest('[data-note]'); if (nt) return noteSheet(+nt.dataset.note);
    const pk = t.closest('[data-pick]'); if (pk) { cart.pickup = +pk.dataset.pick; saveCart(); render(); return; }
    const ty = t.closest('[data-type]'); if (ty) { cart.type = ty.dataset.type; saveCart(); render(); return; }
    const p = t.closest('[data-pm]'); if (p && root.contains(p)) { payMethod = p.dataset.pm; $$('[data-pm]', root).forEach((b) => b.setAttribute('aria-checked', b === p)); return; }
    const o = t.closest('[data-order]'); if (o) return orderSheet(o.dataset.order);

    const act = a.dataset.act;

  }

  /* ---------- public ---------- */
  function mount(el) {
    root = el;
    root.onclick = onClick; root.oninput = onInput;
  }
  function show(v, tableNo) {
    document.body.classList.add('c-mode');
    root.onclick = onClick; root.oninput = onInput; root.onchange = null; root.onkeydown = null;
    if (tableNo) { cart.table = tableNo; cart.type = 'dine-in'; saveCart(); }
    const was = view;
    view = v;
    if (v === 'ar') {
      if (was !== 'menu' && was !== 'ar' || !$('.cust', root)) { view = 'menu'; render(); view = 'ar'; }
      if (!AR.isOpen()) openAR(pendingStart); else if (pendingStart) { AR.close(); openAR(pendingStart); }
      pendingStart = null;

  }
  function onData() {

    if (view === 'bills') { if (!openSheet) render(); else { const keep = window.scrollY; render(); window.scrollTo(0, keep); } }

    if (openSheet && openSheet.refresh) openSheet.refresh();
    if (AR.isOpen()) AR.update({ dishes: arDishes(), categories: cats().filter((c) => S().menu.some((d) => d.category === c && status(d).ok)) });
  }
  function leave() { if (AR.isOpen()) AR.close(); document.body.classList.remove('c-mode'); }
  return { mount, show, onData, leave, get view() { return view; }, primeSeen: () => { for (const o of myOrders()) { lastSeen[o.id] = o.status; lastSeen[o.id + ':pay'] = o.pay && o.pay.status; } } };
})();

        <span class="nm">${vmark(d.veg)}<span>${esc(d.name)}</span></span><span class="pr">${D.rupees(d.price)}</span>${s.ok ? (s.low ? `<span class="why" style="color:var(--warn)">${s.portions} left</span>` : '') : `<span class="why">${esc(s.short || s.label)}</span>`}</button>`;
    }).join('') || '<p class="muted">No dishes match.</p>';

  const posLines = () => pos.lines.map((l) => { const d = X().menuById[l.id]; return d ? Object.assign({}, l, { name: d.name, price: d.price, veg: d.veg, model: d.model }) : null; }).filter(Boolean);
  const posBill = () => D.bill(posLines(), { rate: S().settings.gstRate, incl: S().settings.taxInclusive, discPct: pos.discMode === 'pct' ? +pos.disc || 0 : 0, disc: pos.discMode === 'amt' ? Math.round((+pos.disc || 0) * 100) : 0 });
  function ticketHtml() {
    const lines = posLines(), b = posBill(), n = S().settings.tables || 12;
    return `<div class="row" style="margin-bottom:10px"><h2 style="margin:0">Current bill</h2><span class="grow"></span>${lines.length ? `<button class="btn xs ghost" data-a="pclear">Clear</button>` : ''}</div>
      <div class="row wrap" style="margin-bottom:8px"><div class="seg">${[['dine-in', 'Dine-in'], ['takeaway', 'Takeaway']].map(([k, l]) => `<button data-pt="${k}" aria-pressed="${pos.type === k}">${l}</button>`).join('')}</div>
      ${pos.type === 'dine-in' ? `<select class="in" data-ptable style="width:auto;min-height:36px" aria-label="Table"><option value="">Table</option>${Array.from({ length: n }, (_, i) => `<option ${+pos.table === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select>` : ''}</div>
      <div class="lines">${lines.length ? lines.map((l, i) => `<div class="tline"><div><div class="nm">${esc(l.name)}</div><div class="sm money">${D.rupees(l.price)}</div></div>
        <div class="mini-step"><button data-pdec="${i}" aria-label="One less">${icon('minus', 'sm')}</button><span>${l.qty}</span><button data-pinc="${i}" aria-label="One more">${icon('plus', 'sm')}</button></div><span class="amt">${D.money(Math.round(l.price * 100) * l.qty)}</span></div>`).join('') : '<p class="muted" style="margin:14px 0">Tap a dish to start a bill.</p>'}</div>
      <div class="row" style="margin:12px 0 8px"><label class="field grow"><span>Discount</span><input class="in" inputmode="decimal" placeholder="0" value="${esc(pos.disc)}" data-pdisc></label>
        <div class="seg" style="align-self:flex-end;margin-bottom:3px"><button data-pdm="pct" aria-pressed="${pos.discMode === 'pct'}">%</button><button data-pdm="amt" aria-pressed="${pos.discMode === 'amt'}">₹</button></div></div>

  const totRows = (b) => `<tbody><tr class="sub"><td>Item total</td><td>${D.money(b.sub, true)}</td></tr>${b.disc ? `<tr class="sub"><td>Discount</td><td>−${D.money(b.disc, true)}</td></tr>` : ''}
    <tr class="sub"><td>CGST ${b.rate / 2}%</td><td>${D.money(b.cgst, true)}</td></tr><tr class="sub"><td>SGST ${b.rate / 2}%</td><td>${D.money(b.sgst, true)}</td></tr>${b.round ? `<tr class="sub"><td>Round off</td><td>${b.round > 0 ? '+' : '−'}${D.money(Math.abs(b.round), true)}</td></tr>` : ''}

  function refreshTicket() { const t = $('[data-ticket]', root); if (t) t.innerHTML = ticketHtml(); refreshTiles(); }
  function refreshTiles() { const t = $('[data-tiles]', root); if (!t) return; const ql = pos.q.trim().toLowerCase(); t.innerHTML = tilesHtml(S().menu.filter((d) => (pos.cat === 'All' || d.category === pos.cat) && (!ql || d.name.toLowerCase().includes(ql)))); }
  function posAdd(id) {
    const d = X().menuById[id]; if (!d) return;
    const s = status(d); if (!s.ok) { toast(`${d.name}: ${s.label}`, 'warn'); return; }
    const reserve = {}; for (const l of pos.lines) { const dd = X().menuById[l.id]; for (const r of (dd && dd.recipe) || []) reserve[r.ing] = (reserve[r.ing] || 0) + r.qty * l.qty; }
    if (!D.dishStatus(d, X().stockMap, S().settings, new Date(), reserve).ok) { toast(`Not enough stock for another ${d.name}`, 'warn'); return; }
    const l = pos.lines.find((x) => x.id === id); if (l) l.qty++; else pos.lines.push({ id, qty: 1, note: '' });
    refreshTicket();
  }
  // payment dialog used for new POS bills and for collecting existing orders
  function payDialog(method, amount, ref, onDone) {
    const s = S().settings;
    let body = '';
    if (method === 'cash') {
      const sugg = [amount, Math.ceil(amount / 10000) * 10000, Math.ceil(amount / 50000) * 50000, 200000].filter((v, i, a) => v >= amount && a.indexOf(v) === i).slice(0, 4);
      body = `<div style="font-size:30px;font-weight:700" class="money">${D.money(amount)}</div>
        <label class="field" style="margin-top:12px"><span>Cash received</span><input class="in" inputmode="decimal" value="${(amount / 100).toFixed(0)}" data-recv autofocus></label>
        <div class="row wrap" style="margin-top:8px">${sugg.map((v) => `<button class="btn quiet sm" data-quick="${v}">${D.money(v)}</button>`).join('')}</div>
        <div style="margin-top:12px;font-size:16px">Change to return <b class="money" data-change>₹0</b></div>`;
    } else if (method === 'upi') {
      const link = `upi://pay?pa=${encodeURIComponent((s.upiId || '').toLowerCase()).replace('%40', '@')}&pn=${encodeURIComponent(s.upiName || s.name)}&am=${(amount / 100).toFixed(2)}&cu=INR&tn=${encodeURIComponent('Bill ' + ref)}&tr=${encodeURIComponent(ref)}`;
      body = `<div class="upi-box"><div class="qr">${QR.svg(link, { margin: 1, dark: '#3E2A1E' })}</div><b>Customer scans to pay ${D.money(amount)}</b><span class="muted">UPI ID ${esc(s.upiId)}, reference ${esc(ref)}</span></div>
        <div class="testnote" style="margin-top:10px">${icon('info', 'sm')}<span>Confirm only after the payment shows in your UPI app or soundbox.</span></div>
        <label class="field" style="margin-top:10px"><span>UPI reference (optional)</span><input class="in" data-uref placeholder="12-digit UTR"></label>`;
    } else {
      body = `<div style="font-size:30px;font-weight:700" class="money">${D.money(amount)}</div><p class="muted">Take the payment on your card terminal, then record it here.</p>
        <label class="field"><span>Last 4 digits of the card (optional)</span><input class="in" inputmode="numeric" maxlength="4" data-l4></label>`;
    }
    const m = modal({
      title: { cash: 'Cash payment', upi: 'UPI payment', card: 'Card payment' }[method], body,
      actions: [{ label: 'Back' }, {
        label: method === 'cash' ? 'Complete sale' : 'Payment received', cls: 'saffron', onClick: (mm) => {
          const pay = { method, status: 'paid', at: Date.now(), by: 'staff' };
          if (method === 'cash') { const recv = Math.round((parseFloat($('[data-recv]', mm.el).value) || 0) * 100); if (recv < amount) { toast('Cash received is less than the total', 'warn'); return false; } pay.received = recv; pay.change = recv - amount; }
          if (method === 'upi') pay.ref = ($('[data-uref]', mm.el).value || '').trim() || ref;
          if (method === 'card') { pay.last4 = ($('[data-l4]', mm.el).value || '').replace(/\D/g, '').slice(-4); pay.ref = 'POS'; }
          onDone(pay);
        },
      }],
    });
    if (method === 'cash') {
      const inp = $('[data-recv]', m.el), ch = $('[data-change]', m.el);
      const upd = () => { const r = Math.round((parseFloat(inp.value) || 0) * 100); ch.textContent = D.money(Math.max(0, r - amount)); };
      inp.oninput = upd; upd();
      m.el.addEventListener('click', (e) => { const q = e.target.closest('[data-quick]'); if (q) { inp.value = (+q.dataset.quick / 100).toFixed(0); upd(); } });
    }
  }
  async function posCharge(method) {
    const lines = posLines(); if (!lines.length) return;
    if (pos.type === 'dine-in' && !pos.table) { toast('Choose the table first', 'warn'); const sel = $('[data-ptable]', root); if (sel) sel.focus(); return; }
    const b = posBill();
    const tmpRef = (S().settings.prefix || 'KM') + 'P' + Date.now().toString(36).toUpperCase().slice(-5);
    payDialog(method, b.total, tmpRef, async (pay) => {
      try {
        const no = await D.api.nextNo(), now = Date.now(), ids = D.orderIds(no, S().settings.prefix || 'KM', now);
        const order = Object.assign({ id: ids.id, no, inv: ids.inv, createdAt: now, table: pos.type === 'dine-in' ? +pos.table : null, type: pos.type, source: 'pos', customer: null,
          items: lines.map((l) => ({ id: l.id, name: l.name, price: l.price, qty: l.qty, note: l.note || '', veg: l.veg, model: l.model })), status: 'new', log: [{ s: 'new', at: now }],
          use: D.consumption(lines, X().menuById), pay, note: '' }, b);
        await D.api.putOrder(order);
        pos.lines = []; pos.disc = ''; pos.table = '';

  function collect(id) {

      return modal({ title: `Confirm UPI for ${o.id}`, body: `<p class="muted" style="margin-top:0">The customer says they paid <b class="money">${D.money(o.total)}</b> by UPI${o.pay.ref ? ` with reference <b>${esc(o.pay.ref)}</b>` : ''}. Check your UPI app or soundbox before confirming.</p>`,

          { label: 'Collect another way', cls: 'ghost', onClick: () => { setTimeout(() => chooseCollect(o), 50); } },
          { label: 'Payment received', cls: 'saffron', onClick: async () => { await D.api.patchOrder(o.id, { pay: Object.assign({}, o.pay, { status: 'paid', at: Date.now(), by: 'staff' }) }); toast(`${o.id} paid`); } }] });

  function chooseCollect(o) {

  /* ---------------- bills ---------------- */
  function billsFiltered() {
    const r = rangeOf(bf.range), ql = bf.q.trim().toLowerCase();

      && (!ql || o.id.toLowerCase().includes(ql) || String(o.table || '').includes(ql) || (o.phone && ql.replace(/\D/g, '').length >= 4 && o.phone.includes(ql.replace(/\D/g, ''))) || (o.items || []).some((l) => l.name.toLowerCase().includes(ql))));
  }
  function payCell(o) {

    return p.status === 'paid' ? `<span class="chip ok">${m}</span>` : p.status === 'pending' ? '<span class="chip warn">UPI to confirm</span>' : p.status === 'refunded' ? '<span class="chip">Refunded</span>' : '<span class="chip bad">Unpaid</span>';
  }
  function stChip(o) { const m = { new: ['new', 'New'], preparing: ['info', 'Preparing'], ready: ['ok', 'Ready'], served: ['', 'Served'], cancelled: ['bad', 'Cancelled'] }[o.status] || ['', o.status]; return `<span class="chip ${m[0]}">${m[1]}</span>`; }
  function bills() {
    const list = billsFiltered(), tot = sumBy(list.filter(sales), (o) => o.total);

      `<div class="toolbar"><label class="search">${icon('search')}<input type="search" placeholder="Order ID, table, dish or phone" value="${esc(bf.q)}" data-bq aria-label="Search bills"></label>
        <div class="pills">${[['today', 'Today'], ['yesterday', 'Yesterday'], ['7d', '7 days'], ['30d', '30 days'], ['all', 'All']].map(([k, l]) => `<button class="pill" data-br="${k}" aria-pressed="${bf.range === k}">${l}</button>`).join('')}</div>
        <div class="pills">${[['all', 'Any status'], ['unpaid', 'Unpaid'], ['paid', 'Paid'], ['void', 'Cancelled']].map(([k, l]) => `<button class="pill" data-bs="${k}" aria-pressed="${bf.status === k}">${l}</button>`).join('')}</div></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Order</th><th>Time</th><th>Table</th><th>Items</th><th class="r">Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>
      ${list.slice(0, 300).map((o) => `<tr class="click" data-bill="${esc(o.id)}" tabindex="0"><td><b>${esc(o.id)}</b>${o.demo ? ' <span class="faint" style="font-size:12px">sample</span>' : ''}</td><td>${D.dateShort(o.createdAt)}, ${D.time12(o.createdAt)}</td><td>${o.table || 'Takeaway'}</td>
        <td>${esc((o.items || []).map((l) => `${l.qty}× ${l.name}`).join(', ')).slice(0, 80)}</td><td class="r money">${D.money(o.total)}</td><td>${payCell(o)}</td><td>${stChip(o)}</td></tr>`).join('') || `<tr><td colspan="7"><div class="empty" style="padding:24px">No bills in this view.</div></td></tr>`}
      </tbody></table></div>${list.length > 300 ? `<p class="faint">Showing the latest 300. Export CSV for all ${list.length}.</p>` : ''}`;
  }
  function billDialog(id) {
    const o = S().orders.find((x) => x.id === id); if (!o) return;
    const p = o.pay || {}, canCollect = o.status !== 'cancelled' && p.status !== 'paid' && p.status !== 'refunded';
    const acts = [];
    if (canCollect) acts.push({ label: p.status === 'pending' ? 'Confirm UPI' : 'Collect payment', cls: 'saffron', onClick: () => { setTimeout(() => collect(o.id), 30); } });
    if (o.status !== 'cancelled') acts.push({ label: 'Cancel order', cls: 'danger ghost', onClick: () => { setTimeout(() => cancelOrder(o.id), 30); } });
    if (p.status === 'paid' && o.status !== 'cancelled') acts.push({ label: 'Refund', cls: 'ghost', onClick: async () => { const ok = await confirmBox(`Refund ${D.money(o.total)} for ${o.id}? Return the money the same way it was paid.`, { title: 'Refund this bill?', ok: 'Mark refunded', danger: true }); if (ok) { await D.api.patchOrder(o.id, { pay: Object.assign({}, p, { status: 'refunded', refundAt: Date.now() }) }); toast(`${o.id} refunded`); } } });
    acts.push({ label: 'Download', icon: 'download', cls: 'ghost', close: false, onClick: () => { UI.download(`${o.id}-bill.html`, Invoice.html(o, S().settings), 'text/html'); } });
    if (UI.canPrint()) acts.push({ label: 'Print', icon: 'print', cls: 'ghost', close: false, onClick: () => printHtml(null, Invoice.lines(o, S().settings)) });
    modal({ title: `Bill ${o.id}`, body: `<div class="row wrap" style="margin-bottom:12px">${stChip(o)}${payCell(o)}<span class="chip">${o.source === 'portal' ? 'Customer portal' : 'Counter'}</span>${(o.log || []).map((l) => `<span class="faint" style="font-size:12.5px">${l.s} ${D.time12(l.at)}</span>`).join('')}</div>${Invoice.lines(o, S().settings)}`, actions: acts });
  }

  /* ---------------- reports ---------------- */
  function reports() {
    const r = rangeOf(rf.range), list = S().orders.filter((o) => inRange(o, r)), good = list.filter(sales);
    const gross = sumBy(good, (o) => o.total), taxable = sumBy(good, (o) => o.taxable), gst = sumBy(good, (o) => o.cgst + o.sgst), disc = sumBy(good, (o) => o.disc || 0);
    const refunds = list.filter((o) => o.pay && o.pay.status === 'refunded'), cancelled = list.filter((o) => o.status === 'cancelled');
    const days = []; for (let t = D.startOfDay(r[0] || (good.length ? good[good.length - 1].createdAt : Date.now())); t < r[1]; t += 864e5) days.push(t);
    const byDay = days.slice(-62).map((t) => { const l = good.filter((o) => o.createdAt >= t && o.createdAt < t + 864e5); return { t, l, v: sumBy(l, (o) => o.total) }; });
    const items = {}; for (const o of good) for (const l of o.items || []) { const k = l.id; items[k] = items[k] || { name: l.name, q: 0, v: 0, cat: (X().menuById[l.id] || {}).category || 'Other' }; items[k].q += l.qty; items[k].v += Math.round(l.price * 100) * l.qty; }
    const itemRows = Object.entries(items).sort((a, b) => b[1].v - a[1].v);
    const catSum = {}; for (const [, it] of itemRows) catSum[it.cat] = (catSum[it.cat] || 0) + it.v;
    const itemTot = sumBy(itemRows, ([, it]) => it.v) || 1;
    let cogs = 0; for (const [id, it] of itemRows) { const d = X().menuById[id]; if (d) cogs += D.foodCost(d, X().stockById) * it.q; }
    const paidL = good.filter((o) => o.pay && o.pay.status === 'paid');
    const pay = ['upi', 'card', 'cash'].map((k) => ({ l: { upi: 'UPI', card: 'Card', cash: 'Cash' }[k], c: C[k], v: sumBy(paidL.filter((o) => o.pay.method === k), (o) => o.total) }));
    const unpaid = sumBy(good.filter((o) => o.pay && o.pay.status !== 'paid'), (o) => o.total);
    return head('Reports', 'Sales, GST and food cost for the period. Cancelled and refunded bills are left out of sales.', `<button class="btn ghost sm" data-a="gstcsv">${icon('download', 'sm')}GST summary CSV</button><button class="btn ghost sm" data-a="itemcsv">${icon('download', 'sm')}Item sales CSV</button>`) +

        <div class="kpi"><div class="l">Net sales, before GST</div><div class="v money">${D.money(taxable)}</div><div class="d">${disc ? `${D.money(disc)} in discounts` : 'No discounts'}</div></div>
        <div class="kpi"><div class="l">GST collected</div><div class="v money">${D.money(gst)}</div><div class="d">CGST ${D.money(gst / 2)}, SGST ${D.money(gst / 2)}</div></div>
        <div class="kpi"><div class="l">Food cost estimate</div><div class="v money">${D.money(Math.round(cogs / 100) * 100)}</div><div class="d">${taxable ? Math.round((cogs / taxable) * 100) + '% of net sales, from recipes' : 'From recipes'}</div></div></div>
      ${good.length ? `<div class="dash"><div class="col">
        <div class="box"><h2>Daily sales <span class="faint">GST included</span></h2>${columns(byDay.map((d) => ({ l: new Date(d.t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }), v: d.v, tip: `<b>${D.money(d.v)}</b> on ${D.dateShort(d.t)}, ${d.l.length} bills` })), { label: 'Daily sales', fmtAxis: (v) => D.compact(v), maxLabels: 8 })}</div>
        <div class="box"><h2>Item sales</h2><div class="tblwrap" style="border:0;max-height:420px"><table class="tbl"><thead><tr><th>Dish</th><th class="r">Qty</th><th class="r">Sales</th><th class="r">Share</th></tr></thead><tbody>
          ${itemRows.map(([, it]) => `<tr><td>${esc(it.name)}</td><td class="r num">${it.q}</td><td class="r money">${D.money(it.v)}</td><td class="r num">${Math.round((it.v / itemTot) * 100)}%</td></tr>`).join('')}</tbody></table></div></div>
        <div class="box"><h2>GST summary <span class="faint">For GSTR-1 and GSTR-3B, SAC ${esc(S().settings.sac || '996331')}</span></h2><div class="tblwrap" style="border:0;max-height:360px"><table class="tbl"><thead><tr><th>Date</th><th class="r">Bills</th><th class="r">Taxable</th><th class="r">CGST</th><th class="r">SGST</th><th class="r">Total</th></tr></thead><tbody>

          <tr><td><b>Total</b></td><td class="r num"><b>${good.length}</b></td><td class="r money"><b>${D.money(taxable, true)}</b></td><td class="r money"><b>${D.money(sumBy(good, (o) => o.cgst), true)}</b></td><td class="r money"><b>${D.money(sumBy(good, (o) => o.sgst), true)}</b></td><td class="r money"><b>${D.money(gross, true)}</b></td></tr></tbody></table></div></div>

        <div class="box"><h2>Adjustments</h2><div class="attn"><div style="display:flex;justify-content:space-between;padding:6px"><span>Cancelled orders</span><b class="num">${cancelled.length}</b></div><div style="display:flex;justify-content:space-between;padding:6px"><span>Refunds</span><b class="money">${D.money(sumBy(refunds, (o) => o.total))}</b></div><div style="display:flex;justify-content:space-between;padding:6px"><span>Discounts given</span><b class="money">${D.money(disc)}</b></div></div></div>

  async function saveSetup() {
    const fm = $('[data-sform]', root); if (!fm) return;
    const v = (n) => (fm.elements[n].type === 'checkbox' ? fm.elements[n].checked : fm.elements[n].value.trim());
    const patch = { name: v('name'), tagline: v('tagline'), address: v('address'), phone: v('phone'), gstin: v('gstin').toUpperCase(), fssai: v('fssai'), gstRate: +v('gstRate'), sac: v('sac'), taxInclusive: v('taxInclusive'), upiId: v('upiId'), upiName: v('upiName'), prefix: v('prefix').toUpperCase().replace(/[^A-Z]/g, '') || 'KM', tables: Math.max(1, Math.min(99, parseInt(v('tables'), 10) || 12)), timeMenus: v('timeMenus'), pin: v('pin'),
      loyalty: v('loyalty'), beanPer: Math.max(1, parseInt(v('beanPer'), 10) || 10), redeemBeans: Math.max(1, parseInt(v('redeemBeans'), 10) || 100), redeemValue: Math.max(1, parseInt(v('redeemValue'), 10) || 50) };
    if (!patch.name) return toast('Enter the café name', 'warn');
    if (!/^\d{4}$/.test(patch.pin)) return toast('The staff PIN needs 4 digits', 'warn');
    if (patch.upiId && !/^[\w.-]{2,}@[a-zA-Z]{2,}$/.test(patch.upiId)) return toast('That UPI ID doesn’t look right, for example yourcafe@okaxis', 'warn');
    if (patch.gstin && !/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(patch.gstin)) return toast('A GSTIN has 15 characters, for example 29ABCDE1234F1Z5', 'warn');
    if (patch.fssai && !/^\d{14}$/.test(patch.fssai)) return toast('The FSSAI number has 14 digits', 'warn');
    try { await D.api.setSettings(patch); toast('Settings saved'); } catch (e) { /* handled */ }
  }

  /* ---------------- actions ---------------- */
  async function act(a, el) {
    if (a === 'lock') { if (supa()) D.api.adapter.signOut().catch(() => {}); unlocked = false; try { sessionStorage.removeItem('km.staff'); } catch (e) { /* ignore */ } render(); }
    if (a === 'side') { sideOpen = !sideOpen; $('.side', root).classList.toggle('open', sideOpen); }
    if (a === 'sound') { soundOn = !soundOn; if (soundOn) { UI.unlockAudio(); UI.chime(); } render(); }
    if (a === 'pclear') { pos.lines = []; pos.disc = ''; refreshTicket(); }
    if (a === 'bcsv') exportBills();
    if (a === 'gstcsv') exportGST();
    if (a === 'itemcsv') exportItems();
    if (a === 'dnew') dishEditor(null);
    if (a === 'snew') ingredientEditor(null);
    if (a === 'qrsheet') qrSheet();
    if (a === 'tsave') { const n = parseInt($('[data-tn]', root).value, 10); const u = $('[data-tu]', root).value.trim(); await D.api.setSettings({ tables: Math.max(1, Math.min(99, n || 12)), portalUrl: u }); toast('Saved'); }
    if (a === 'ssave') saveSetup();
    if (a === 'buycopy' || a === 'buycsv') {
      const list = Object.values(X().stockMap).filter((s) => s.state !== 'ok').map((s) => { const sug = Math.max(s.reorder * 2 - Math.max(0, s.qty), s.reorder); const r = s.unit === 'g' || s.unit === 'ml' ? Math.ceil(sug / 500) * 500 : Math.ceil(sug); return [s.name, fmtQty(r, s.unit), s.supplier || '', (r * (s.cost || 0)).toFixed(2)]; });
      if (a === 'buycopy') UI.copy(`Purchase list, ${D.dateShort(Date.now())}\n` + list.map((r) => `${r[0]}: ${r[1]} (${r[2]})`).join('\n'));
      else UI.download(`purchase-list-${D.dayKey(Date.now())}.csv`, csv([['Ingredient', 'Quantity', 'Supplier', 'Estimated cost'], ...list]), 'text/csv');
    }
    if (a === 'sample') {
      const ok = await confirmBox('Add about two weeks of sample sales so the dashboard and reports have data? They are marked as samples, do not touch stock, and can be removed here later.', { title: 'Add sample sales?', ok: 'Add sample sales', cancel: 'Not now' });
      if (!ok) return;
      const start = Math.max(1000, ...S().orders.map((o) => o.no || 0));
      const list = D.sampleOrders(S().menu.length ? S().menu : D.defaultMenu(), S().settings, start, 14);
      toast(`Adding ${list.length} sample sales…`, 'ok', 2000);
      try { await D.api.putOrders(list, (i, n) => toast(`Added ${i} of ${n}…`, 'ok', 1200)); if (D.api.adapter.setCounter) await D.api.adapter.setCounter(start + list.length); else if (S().mode === 'cloud') await D.api.adapter.db.doc('meta/counter').set({ no: start + list.length, at: Date.now() }); toast(`${list.length} sample sales added`); } catch (e) { toast('Could not add all sample sales', 'bad'); }
    }
    if (a === 'unsample') {
      const ids = S().orders.filter((o) => o.demo).map((o) => o.id);
      if (await confirmBox(`Remove ${ids.length} sample sales? Real orders stay.`, { title: 'Remove sample sales?', ok: 'Remove', danger: true })) { toast('Removing…', 'ok', 1500); await D.api.delOrders(ids, (i, n) => toast(`Removed ${i} of ${n}…`, 'ok', 1200)); toast('Sample sales removed'); }
    }
    if (a === 'seed') {
      if (S().menu.length && !(await confirmBox('Replace the menu and stock with the starter set? Orders and bills stay.', { title: 'Reset menu and stock?', ok: 'Reset', danger: true }))) return;
      toast('Loading the starter menu…', 'ok', 1500);
      try { await D.api.seed(); toast('Starter menu and stock loaded'); } catch (e) { toast('Could not load the starter menu', 'bad'); }
    }
    if (a === 'export') UI.download(`cafe-data-${D.dayKey(Date.now())}.json`, JSON.stringify({ settings: S().settings, menu: S().menu, stock: S().stock, ledger: S().ledger, orders: S().orders }, null, 1), 'application/json');
  }
  function onClick(e) {
    const t = e.target;
    if (!unlocked) { const p = t.closest('[data-pin]'); if (p) pinPress(p.dataset.pin); return; }
    const g = (sel) => t.closest(sel);
    let el;
    if ((el = g('[data-a]'))) return act(el.dataset.a, el);
    if ((el = g('[data-next]'))) return advance(el.dataset.next, el.dataset.to);
    if ((el = g('[data-cancel]'))) return cancelOrder(el.dataset.cancel);
    if ((el = g('[data-kot]'))) { const o = S().orders.find((x) => x.id === el.dataset.kot); if (o) { if (UI.canPrint()) printHtml(null, kotText(o).replace(/^[\s\S]*<body>|<\/body>[\s\S]*$/g, '')); else UI.download(`KOT-${o.id}.html`, kotText(o), 'text/html'); } return; }
    if ((el = g('[data-kf]'))) { kf.type = el.dataset.kf; return render(); }
    if ((el = g('[data-bill]'))) return billDialog(el.dataset.bill);
    if ((el = g('[data-collect]'))) return collect(el.dataset.collect);
    if ((el = g('[data-padd]'))) return posAdd(el.dataset.padd);
    if ((el = g('[data-pinc]'))) { const l = pos.lines[+el.dataset.pinc]; if (l) posAdd(l.id); return; }
    if ((el = g('[data-pdec]'))) { const i = +el.dataset.pdec; if (pos.lines[i]) { pos.lines[i].qty--; if (pos.lines[i].qty <= 0) pos.lines.splice(i, 1); } return refreshTicket(); }
    if ((el = g('[data-pt]'))) { pos.type = el.dataset.pt; return refreshTicket(); }
    if ((el = g('[data-pdm]'))) { pos.discMode = el.dataset.pdm; return refreshTicket(); }
    if ((el = g('[data-pc]'))) { pos.cat = el.dataset.pc; $$('[data-pc]', root).forEach((b) => b.setAttribute('aria-pressed', b === el)); return refreshTiles(); }
    if ((el = g('[data-pay]'))) return posCharge(el.dataset.pay);
    if ((el = g('[data-br]'))) { bf.range = el.dataset.br; return render(); }
    if ((el = g('[data-bs]'))) { bf.status = el.dataset.bs; return render(); }
    if ((el = g('[data-mc]'))) { mf.cat = el.dataset.mc; return render(); }
    if ((el = g('[data-dedit]'))) return dishEditor(el.dataset.dedit);
    if ((el = g('[data-st]'))) { sf.tab = el.dataset.st; return render(); }
    if ((el = g('[data-sbuy]'))) return stockDialog('buy', el.dataset.sbuy, +el.dataset.sugg || 0);
    if ((el = g('[data-swaste]'))) return stockDialog('waste', el.dataset.swaste);
    if ((el = g('[data-scount]'))) return stockDialog('count', el.dataset.scount);
    if ((el = g('[data-sedit]'))) return ingredientEditor(el.dataset.sedit);
    if ((el = g('[data-rr]'))) { rf.range = el.dataset.rr; return render(); }
    if (sideOpen && g('.side a')) { sideOpen = false; }
  }
  function onInput(e) {
    const t = e.target;
    if (t.matches('[data-pq]')) { pos.q = t.value; refreshTiles(); }
    if (t.matches('[data-pdisc]')) { pos.disc = t.value; const tb = $('[data-ptot]', root); if (tb) tb.innerHTML = totRows(posBill()); }
    if (t.matches('[data-bq]')) { bf.q = t.value; clearTimeout(onInput.t); onInput.t = setTimeout(() => { render(); const i = $('[data-bq]', root); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
    if (t.matches('[data-mq]')) { mf.q = t.value; clearTimeout(onInput.t); onInput.t = setTimeout(() => { render(); const i = $('[data-mq]', root); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
    if (t.matches('[data-sq]')) { sf.q = t.value; clearTimeout(onInput.t); onInput.t = setTimeout(() => { render(); const i = $('[data-sq]', root); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
  }
  function onChange(e) {
    const t = e.target;
    if (t.matches('[data-ptable]')) pos.table = t.value;
    if (t.matches('[data-dact]')) { const d = X().menuById[t.dataset.dact]; if (d) D.api.putDish(Object.assign({}, d, { active: t.checked })).then(() => toast(`${d.name} ${t.checked ? 'is on the menu' : 'is hidden from the menu'}`)); }
  }
  function onKey(e) { if (e.key === 'Enter' && e.target.matches('tr[data-bill]')) billDialog(e.target.dataset.bill); }

  /* ---------------- new-order alerts ---------------- */
  function watch() {
    const list = S().orders;
    if (!primed) { if (S().ready && (S().mode !== 'cloud' || S().synced)) { list.forEach((o) => seen.add(o.id)); primed = true; } return; }
    for (const o of list) {
      if (seen.has(o.id)) continue;
      seen.add(o.id);
      if (o.status === 'new' && Date.now() - o.createdAt < 5 * 60000 && unlocked && page !== 'board' && document.body.classList.contains('s-mode') && o.source === 'portal') {
        toast(`New order ${o.id}, ${o.table ? 'Table ' + o.table : 'Takeaway'}, ${D.money(o.total)}`, 'ok', 5000);
        if (soundOn) UI.chime();
      }
    }
  }

  /* ---------------- public ---------------- */
  function mount(el) { root = el; }
  function show(p) {
    page = PAGES.some(([k]) => k === p) ? p : 'overview';
    sideOpen = false;
    document.body.classList.add('s-mode');
    root.onclick = onClick; root.oninput = onInput; root.onchange = onChange; root.onkeydown = onKey;
    render();
  }
  function onData() {
    watch();
    if (!root || !document.body.classList.contains('s-mode')) return;
    const a = document.activeElement;
    if (a && root.contains(a) && (a.matches('input,select,textarea'))) { if (page === 'billing') { refreshTiles(); const t = $('[data-ptot]', root); if (t) t.innerHTML = totRows(posBill()); } return; }
    if (page === 'billing' && $('[data-ticket]', root)) { const w = $('.pos', root); if (w) { const y = window.scrollY; render(); window.scrollTo(0, y); } return; }
    render();
  }
  function leave() { clearInterval(ticker); document.body.classList.remove('s-mode'); }
  return { mount, show, onData, leave, watch };
})();

'use strict';
/* Boot + hash router. Views: #welcome, customer (#table-N, #menu, #ar, #cart, #bills), staff (#staff, #staff-orders, ...) */
(() => {
  const { $, esc, icon, toast } = UI;
  let app = null;
  function welcome() {
    document.body.classList.remove('c-mode', 's-mode');
    const s = Data.state.settings, m = Data.state.mode;
    const note = m === 'cloud' ? 'Orders sync live between every device signed in to Claude. Open the customer portal on your phone and the café manager on a laptop, then watch an order arrive.'
      : m === 'connecting' ? 'Connecting to the shared café database…'
        : m === 'local-preview' ? 'Sign in to Claude to sync orders between devices. Until then, everything is saved in this browser.'
          : 'Running in this browser. Orders sync between tabs on this device. Connect a shared database to sync phones and the counter.';
    app.onclick = null; app.oninput = null; app.onchange = null; app.onkeydown = null;
    app.innerHTML = `<div class="welcome"><div class="welcome-in">
      <span class="plate lg">${esc(s.name)}</span>
      <h1>A menu guests can see on their table</h1>
      <p class="lead">Two apps in one link. Guests open the camera, swipe through dishes in 3D, order and pay. Staff run billing, the kitchen board, stock and GST reports.</p>
      <div class="doors">
        <a class="door c" href="#table-3">${icon('camera', 'lg')}<h2>Customer portal</h2><p>What guests see after scanning the QR code on their table.</p><span class="go">Open as Table 3</span></a>
        <a class="door" href="#staff">${icon('register', 'lg')}<h2>Café manager</h2><p>Billing, kitchen tickets, bills, menu, recipe-based stock, reports and table QR codes.</p><span class="go">Open the staff software</span></a>
      </div>
      <div class="tables">Jump to a table ${Array.from({ length: Math.min(8, s.tables || 12) }, (_, i) => `<a href="#table-${i + 1}">${i + 1}</a>`).join('')}</div>
      <div class="mode-note">${icon('info', 'sm')}<span>${note}</span></div></div></div>`;
  }
  let current = '';
  // KM_APP: 'customer' (index.html, guests only), 'cafe' (cafe.html, staff only) or 'both' (demo.html, one link for both)
  const APP = window.KM_APP || 'both';
  function route() {
    const h = (location.hash || '').slice(1);
    UI.closeAll();
    let m;
    if (APP === 'customer') {
      current = 'cust';
      if ((m = /^table-(\d{1,3})$/.exec(h))) return Cust.show('menu', +m[1]);
      return Cust.show(['menu', 'cart', 'bills', 'ar'].includes(h) ? h : 'menu');
    }
    if (APP === 'cafe') { current = 'staff'; return Staff.show(h.startsWith('staff-') ? h.slice(6) : h || 'overview'); }
    if ((m = /^table-(\d{1,3})$/.exec(h))) { Staff.leave(); current = 'cust'; Cust.show('menu', +m[1]); return; }
    if (['menu', 'cart', 'bills', 'ar'].includes(h)) { Staff.leave(); current = 'cust'; Cust.show(h); return; }
    if (h === 'staff' || h.startsWith('staff-')) { Cust.leave(); current = 'staff'; Staff.show(h === 'staff' ? 'overview' : h.slice(6)); return; }
    Cust.leave(); Staff.leave(); current = 'welcome'; welcome();
  }
  let pending = false;
  function onData() {
    if (pending) return; pending = true;
    requestAnimationFrame(() => {
      pending = false;
      if (APP !== 'customer') Staff.watch();
      if (current === 'cust') Cust.onData(); else if (current === 'staff') Staff.onData(); else welcome();
      if (current !== 'cust' && APP !== 'cafe') Cust.onData();
    });
  }
  Data.onWriteError((e) => {
    const c = e && e.code;
    const msg = c === 'invalid_argument' ? 'You can view this café but not change it. Ask the owner for edit access.'
      : c === 'quota_exceeded' ? 'The café database is full. Export your data and remove old sample sales.'
        : c === 'resource_exhausted' ? 'Too many changes at once. Wait a moment and try again.'
          : 'Could not save. Check your connection and try again.';
    toast(msg, 'bad', 4500);
  });
  async function waitForRuntime(ms) {
    const t0 = Date.now();
    while (Date.now() - t0 < ms) { if (typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function') return true; await new Promise((r) => setTimeout(r, 60)); }
    return false;
  }
  async function boot() {
    app = $('#app');
    Cust.mount(app); Staff.mount(app);
    Data.on(onData);
    window.addEventListener('hashchange', route);
    route();
    await waitForRuntime(900);
    await Data.init();
    if (APP !== 'cafe') Cust.primeSeen();
    if (Viewer.ok()) for (const [k] of Dishes.LIST) Viewer.requestThumb(k);
    route();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
